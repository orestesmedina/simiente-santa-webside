name: Controles del kit

# Este archivo lo gestiona el kit (make install-kit lo reemplaza): no lo edites en el proyecto.
# Solo trae los controles que no dependen de la tecnología. Las pruebas, el análisis y la auditoría de cada
# parte van en el workflow del proyecto (.github/workflows/ci.yml), que redacta el comando bowser-ci desde
# el perfil (equipo/perfil.json).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: bowser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit, agentes y perfil al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Si el repositorio del kit es privado, crea el secreto KIT_TOKEN (token con lectura del kit).
          token: ${{ secrets.KIT_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Archivos del kit coinciden con su submódulo
        if: hashFiles('.kit-manifest.json') != ''
        run: python3 "$(bash scripts/ruta-kit.sh)/scripts/instalar_kit.py" --verificar
      - name: Configuración de agentes generada al día
        run: python3 scripts/sincronizar.py --verificar
      - name: Perfil del proyecto válido
        if: hashFiles('equipo/perfil.json') != ''
        run: python3 scripts/perfil.py --verificar
      - name: La integración continua del proyecto ejecuta los verbos del perfil (aviso)
        run: python3 scripts/ci.py

  controles:
    name: Archivos inmutables y constitución
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Los archivos inmutables del perfil no se modifican
        run: python3 scripts/verbos.py --inmutables "origin/${{ github.base_ref }}"
      - name: Aviso si cambia la constitución
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qxE "equipo/(principios|reglas)\.md"; then
            echo "::warning::Este PR modifica la constitución (los principios o las reglas del proyecto). Requiere aprobación de la dirección técnica (configura CODEOWNERS)."
          fi

  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
