# CI del proyecto: ejecuta en GitHub lo mismo que el equipo corre con `make ci`.
# Los comandos viven en equipo/perfil.json; este workflow solo instala las herramientas
# de cada parte, levanta sus servicios y llama a `make ci PART=<parte>`.
# Lo que no depende de la tecnología (kit, agentes, perfil, inmutables, constitución y
# secretos) está en .github/workflows/bowser.yml y no se repite aquí.

name: CI del proyecto

on:
  pull_request:
  push:
    branches: [main]

# Si llega otro commit a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nada de este workflow escribe en el repositorio ni despliega.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go 1.27.2 · PostgreSQL 16)
    runs-on: ubuntu-latest
    # Base de datos de pruebas, misma versión que el entorno local (postgres:16-alpine
    # en docker-compose.yml). Las credenciales nacen y mueren con el job: no son un
    # secreto. Redis no va como servicio: lo levantan las pruebas con testcontainers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_efimera
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # La leen las pruebas de integración (backend/internal/platform/testutil/db.go).
      # Sin ella se saltan solas: por eso el job la define siempre.
      DATABASE_URL_TEST: postgres://ci:ci_efimera@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      # Go en la versión del proyecto, leída de backend/go.mod (la misma que el Dockerfile).
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      # Herramientas que llaman los verbos del perfil y el lenguaje no trae, en la
      # versión exacta que fija el README §Herramientas de desarrollo. No se usa la
      # action de golangci-lint: `make ci` ya lo ejecuta y correría dos veces.
      - name: Herramientas del perfil (versiones fijadas)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Paso propio del proyecto: aplica las migraciones a la base vacía antes de las
      # pruebas. Así las de integración corren de verdad y se comprueba que aplican
      # desde cero. `-path migrations` es relativo a backend/.
      - name: Migraciones aplicadas a la base vacía
        working-directory: backend
        run: migrate -path migrations -database "$DATABASE_URL_TEST" up

      # Único punto de revisión: formato, revisar, generar (--verificar), probar y
      # auditar, según el perfil. La cobertura está sin definir y se informa como tal.
      - run: make ci PART=backend

  frontend:
    name: Frontend (React 19 · Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node en la versión del proyecto. No hay .nvmrc: el valor sale del Dockerfile
      # del frontend (node:24.21-alpine) y del README §Herramientas de desarrollo.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dependencias reproducibles con el lockfile. Antes de `make ci`: formato usa
      # prettier, revisar usa eslint y tsc, generar usa openapi-typescript.
      - name: Dependencias con el lockfile (npm ci)
        working-directory: frontend
        run: npm ci

      # Único punto de revisión: formato, revisar, generar (--verificar), probar y
      # auditar, según el perfil. La cobertura está sin definir y se informa como tal.
      - run: make ci PART=frontend

      # Paso propio del proyecto (no es un verbo del perfil): comprueba que la build
      # de Vite produce dist/. Va después de `make ci`, que detecta antes los fallos.
      - name: Build de la SPA (paso propio)
        working-directory: frontend
        run: npm run build
