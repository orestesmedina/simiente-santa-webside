name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versiones de las herramientas: fijadas aquí (nada de `latest`). Este archivo lo gestiona el kit;
# si tu proyecto necesita otra versión antes de que el kit se actualice (ej. un Go más nuevo),
# crea una variable del repositorio en GitHub (Settings → Secrets and variables → Actions → Variables)
# con el mismo nombre: GOLANGCI_LINT_VERSION, MIGRATE_VERSION, GOVULNCHECK_VERSION o NODE_VERSION.
env:
  GOLANGCI_LINT_VERSION: ${{ vars.GOLANGCI_LINT_VERSION || 'v2.14.0' }}
  MIGRATE_VERSION: ${{ vars.MIGRATE_VERSION || 'v4.20.1' }}
  GOVULNCHECK_VERSION: ${{ vars.GOVULNCHECK_VERSION || 'v1.8.0' }}
  NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}

jobs:
  agentes:
    name: Kit y configuración de agentes al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Si el repositorio del kit es privado, crea el secreto KIT_TOKEN (token con lectura del kit).
          token: ${{ secrets.KIT_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Archivos del kit coinciden con su submódulo
        if: hashFiles('.kit-manifest.json') != ''
        run: python3 "$(bash scripts/ruta-kit.sh)/scripts/instalar_kit.py" --verificar
      - name: Configuración de agentes generada al día
        run: python3 scripts/sincronizar.py --verificar

  controles:
    name: Migraciones y constitución
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Migraciones existentes no se modifican
        run: |
          CAMBIADAS=$(git diff --name-only --diff-filter=MRD origin/${{ github.base_ref }}...HEAD -- 'backend/migrations/*.sql')
          if [ -n "$CAMBIADAS" ]; then echo "::error::Migraciones existentes modificadas: $CAMBIADAS"; exit 1; fi
      - name: Aviso si cambia la constitución
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx ".specify/memory/constitution.md"; then
            echo "::warning::Este PR modifica la constitución. Requiere aprobación de la dirección técnica (configura CODEOWNERS)."
          fi

  detectar:
    name: Detectar proyectos
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          echo "backend=$([ -f backend/go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_password
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://app:app_ci_password@localhost:5432/app_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Migraciones
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@"$MIGRATE_VERSION"
          migrate -path migrations -database "$DATABASE_URL_TEST" up
      - name: Pruebas unitarias e integración
        run: go test -race -coverprofile=coverage.out ./... && go test -tags=integration ./...
      - name: Vulnerabilidades
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          govulncheck ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    needs: detectar
    if: needs.detectar.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Vulnerabilidades
        run: npm audit --audit-level=high

  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
