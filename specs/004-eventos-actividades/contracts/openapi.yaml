        "200":
          description: Actividad con todos sus datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActividadAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [actividades-admin]
      operationId: updateActividad
      summary: Edita una actividad (los campos presentes)
      description: |
        Actualización parcial (FR-011) con la misma regla de publicación que los
        eventos (FR-013/FR-014): `publicationState` por elemento y "se publica al
        guardar". Auditoría `activity.update` / `activity.publish` /
        `activity.unpublish` (dos filas si cambian datos y estado a la vez).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AgendaItemId"
      requestBody:
        required: true
