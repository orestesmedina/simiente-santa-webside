            (R4-2): el panel muestra el elemento como pasado sin tocar su estado.
      additionalProperties: false
    EventoAdmin:
      type: object
      required:
        [id, titleEs, detailEs, placeEs, publicationState, dates, nextDate, isPast, createdAt, updatedAt]
      description: |
        Evento completo del panel: ambos idiomas (es obligatorio, en opcional),
        todas sus fechas (próximas y pasadas) y su estado de publicación (FR-010,
        US4 esc. 7).
      properties:
        id:
          type: string
          format: uuid
        titleEs:
          type: string
          maxLength: 160
        titleEn:
          type: [string, "null"]
          maxLength: 160
        frequencyEs:
          type: [string, "null"]
          maxLength: 160
          description: Texto opcional de frecuencia en español (Q1).
        frequencyEn:
          type: [string, "null"]
          maxLength: 160
        detailEs:
          type: string
          maxLength: 2000
        detailEn:
          type: [string, "null"]
          maxLength: 2000
        placeEs:
          type: string
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        mapUrl:
          type: [string, "null"]
          maxLength: 500
        organizerEs:
          type: [string, "null"]
          maxLength: 160
        organizerEn:
          type: [string, "null"]
          maxLength: 160
        categoryId:
          type: [string, "null"]
          format: uuid
        imageFile:
          type: [string, "null"]
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
