        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/v1/admin/actividades/imagenes:
    post:
      tags: [actividades-admin]
      operationId: uploadActividadImage
      summary: Sube una imagen para una actividad (JPEG/PNG/WebP, ≤8 MB)
      description: |
        Igual que `POST /api/v1/admin/eventos/imagenes` (mismas reglas R3-8),
