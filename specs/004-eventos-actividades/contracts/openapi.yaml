          application/json:
            schema:
              $ref: "#/components/schemas/ActividadPatch"
      responses:
        "200":
          description: Actividad actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActividadAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [actividades-admin]
      operationId: deleteActividad
      summary: Elimina una actividad (definitiva, con confirmación en la interfaz)
      description: Borrado físico (sin papelera), registrado con `activity.delete`; desaparece del público de inmediato.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AgendaItemId"
