  /api/v1/admin/categorias:
    get:
      tags: [categorias-admin]
      operationId: listCategorias
      summary: Catálogo de categorías (compartido por eventos y actividades)
      description: |
        Catálogo completo para los selectores de los formularios y su gestión
        (Q6). Exige el permiso **`categorias`** (10.º del catálogo de F2,
        sembrado en la migración `000009`; research R4-4 — cambio de alcance
        aprobado el 2026-10-11: **no** basta `eventos` ni `actividades`).
        Listado acotado en el servidor (≤100, `ORDER BY sortOrder, id`),
        sin paginación: es un catálogo pequeño (§8.1.3, misma excepción
        documentada que las colecciones de F3).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Catálogo de categorías.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaAdminList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [categorias-admin]
      operationId: createCategoria
      summary: Crea una categoría del catálogo
      description: |
        Alta en el catálogo (Q6): nombre en español obligatorio y en inglés
        opcional, con `sortOrder` opcional. Nombre duplicado → `409`. Requiere
        el permiso `categorias`. Auditoría `category.create`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaInput"
      responses:
        "201":
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/v1/admin/categorias/{id}:
    patch:
      tags: [categorias-admin]
      operationId: updateCategoria
      summary: Edita una categoría (los campos presentes)
      description: |
        Actualización parcial del catálogo (Q6). Renombrar está permitido y el
        cambio se hace visible de inmediato en los elementos publicados que la
        usan (es un dato del elemento, como cualquier otro). Nombre duplicado →
        `409`. Requiere el permiso `categorias`. Auditoría `category.update`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AgendaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaPatch"
      responses:
        "200":
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [categorias-admin]
      operationId: deleteCategoria
      summary: Elimina una categoría del catálogo
      description: |
        Borrado físico con confirmación en la interfaz. Si hay eventos o
        actividades usando la categoría responde `409 conflict` (FK `ON DELETE
        RESTRICT`, R4-5 — **decisión firme** de la puerta 2: la categoría en
        uso no se desliga automáticamente): primero hay que quitarles la
        categoría. Requiere el permiso `categorias`. Auditoría
        `category.delete`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AgendaItemId"
      responses:
        "204":
          description: Categoría eliminada.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

components:
  parameters:
    AgendaItemId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del elemento de agenda (evento, actividad o categoría).
      schema:
        type: string
        format: uuid
    ListLimit:
      name: limit
      in: query
      required: false
      description: Tamaño de página (por defecto 20, máximo 100; §8.1.3).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ListOffset:
      name: offset
      in: query
      required: false
      description: Desplazamiento (mínimo 0; §8.1.3).
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    # ------------------------------------------------------------ comunes
    Date:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: |
        Fecha de calendario del lugar ("YYYY-MM-DD"). No es un timestamp: no se
        convierte de zona horaria (FR-009: el día real del elemento no cambia).
        El formato visible lo localiza el cliente.
    ClockTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: |
        Hora "HH:MM" de 24 h del lugar. El formato a.m./p.m. es presentación del
        cliente (patrón de F3).
    CategoriaPublica:
      type: object
      required: [id, name]
      description: Categoría publicada del elemento, ya localizada a `lang` (Q6).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
      additionalProperties: false
    ImagenPublica:
      type: object
      required: [url, alt]
      description: Imagen opcional del elemento con su texto alternativo accesible (FR-020).
      properties:
        url:
          type: string
          description: URL relativa al origen de la API (`/api/v1/media/<file>`).
        alt:
          type: string
          maxLength: 300
          description: Texto alternativo (FR-020); resuelto a `lang` con fallback.
      additionalProperties: false
    OcurrenciaPublica:
      type: object
      required: [date]
      description: |
        Fecha concreta de un evento con su horario opcional (Q2). Solo fechas
        **próximas** viajan en la respuesta pública (FR-002/FR-006).
      properties:
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de inicio opcional (`null`/ausente = sin hora).
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de fin opcional; **exige `startTime`** (decisión firme de la puerta 2) y siempre es posterior a él.
      additionalProperties: false

    # ------------------------------------------------------------- público
    PortadaProximamente:
      type: object
      required: [lang]
      description: |
        Extracto «Lo que viene» de la portada (US7, enmienda del 2026-10-12,
        **refinada el mismo día**): hasta **5** ítems próximos, eventos y
        actividades juntos y ordenados por cercanía (ventana de 2 meses con
        respaldo; ver la descripción de la operación). `items` está presente
        **solo** si hay ítems; vacío/ausente significa "no hay nada publicado y
        próximo" y la portada muestra el bloque con su mensaje (FR-026). Nunca
        es `null` (§8.1.2) y nunca supera los 5 elementos (FR-025, tope firme
        del servidor: no es configurable desde la API).
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ItemProximoPortada"
      additionalProperties: false
    ItemProximoPortada:
      type: object
      required: [kind, id, title, date, place]
      description: |
        Ítem del bloque de la portada: **solo** lo que la tarjeta compacta de la
        fila horizontal muestra (FR-025) — identificación como evento o
        actividad (Decisión 3), título, **próxima** fecha con su horario
        opcional, lugar e **imagen** con su texto alternativo, todo ya localizado
        a `lang` (FR-008). Sin `detail`, categoría ni lista de fechas: el
        detalle vive en la sección `/eventos` (el botón «Ver más eventos» lleva
        a ella; FR-026). La composición visual de la fila y las tarjetas la fija
        `ux.md`.
      properties:
        kind:
          type: string
          enum: [event, activity]
          description: |
            Concepto del ítem (Decisión 3): `event` (encuentro periódico) o
            `activity` (acción puntual). El cliente lo usa para etiquetar el
            ítem y para enlazar al bloque correspondiente de `/eventos`.
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 160
        date:
          allOf:
            - $ref: "#/components/schemas/Date"
          description: |
            Próxima fecha del ítem (`YYYY-MM-DD`): la primera fecha próxima del
            evento o la fecha única de la actividad. Siempre es una fecha
            **próxima** según la regla del servidor (R4-2).
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de inicio opcional (`null`/ausente = sin hora).
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de fin opcional; **exige `startTime`** y siempre es posterior a él.
        place:
          type: string
          maxLength: 200
        image:
          $ref: "#/components/schemas/ImagenPublica"
          description: |
            Imagen opcional del elemento con su texto alternativo (FR-020) para
            la tarjeta compacta; misma URL relativa `/api/v1/media/<file>` y
            misma regla de publicación que la sección (solo contenido publicado
            y próximo). Ausente si el elemento no tiene imagen.
      additionalProperties: false

    ProximamentePublica:
      type: object
      required: [lang]
      description: |
        "Lo que viene" publicado y con fecha desde hoy en adelante, resuelto a
        `lang` (fallback `en → es` por campo, FR-008). Las claves de bloque están
        presentes **solo** si tienen elementos (SC-012); si están presentes, sus
        arrays nunca son `null` (§8.1.2) y están acotados a **200 elementos**
        cada uno (constante de seguridad del servidor, RG4-8 del plan).
        `events` va ordenado por la primera
        fecha próxima de cada evento; `activities` por su fecha (FR-003).
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventoPublico"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActividadPublica"
      additionalProperties: false
    EventoPublico:
      type: object
      required: [id, title, dates, place, detail]
      description: |
        Evento publicado con **al menos una fecha próxima** (FR-004): `dates[0]`
        es "la próxima fecha" que el visitante identifica; el resto son las
        siguientes cargadas. `frequency` es el texto opcional de frecuencia (p.
        ej. «todos los viernes»); el sistema **no** calcula recurrencias.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 160
        frequency:
          type: string
          maxLength: 160
          description: Texto opcional de frecuencia, ya localizado (puede provenir del español por fallback).
        dates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OcurrenciaPublica"
        place:
          type: string
          maxLength: 200
        mapUrl:
          type: string
          maxLength: 500
          description: Enlace de mapa/ubicación opcional (solo se valida el formato; no se verifica el destino).
        detail:
          type: string
          maxLength: 2000
          description: Detalle/descripción, texto plano (≤2.000 caracteres), ya localizado.
        organizer:
          type: string
          maxLength: 160
          description: Organizador/encargado opcional (texto).
        category:
          $ref: "#/components/schemas/CategoriaPublica"
        image:
          $ref: "#/components/schemas/ImagenPublica"
      additionalProperties: false
    ActividadPublica:
      type: object
      required: [id, title, date, place, detail]
      description: |
        Actividad publicada con **fecha única** (Decisión 3/FR-005): un día
        concreto con hora de inicio y hora de fin opcionales (un solo valor de
        hora o ninguno también es válido).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 160
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        endTime:
          allOf:
