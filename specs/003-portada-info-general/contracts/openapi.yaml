# ============================================================================
# DELTA DE DISEÑO — Spec Kit (fase /speckit.plan de F3, 2026-10-09)
# Funcionalidad: Portada e información general (spec.md, aprobada por el humano
# el 2026-10-09 con las 10 aclaraciones resueltas)
#
# ESTE ARCHIVO ES UN DELTA, NO EL CONTRATO VIVO. Se fusiona (aditivamente) en
# `backend/api/openapi.yaml` en la primera tarea de implementación (§8.1.5 de
# docs/tecnico/arquitectura.md), que pasa de info.version 0.3.0 a 0.4.0.
# Este snapshot de specs/ NO se vuelve a editar.
#
# Se REUTILIZAN del documento vivo (definidos por F1/F2, no se redefinen aquí):
#   - components/responses: NotFound, MethodNotAllowed, Invalid, Unauthenticated,
#     Forbidden, Conflict, TooManyRequests, DatabaseUnavailable, Internal
#   - components/schemas: ErrorEnvelope, ErrorBody
#   - components/securitySchemes: sessionCookie
# El registro de `error.code` NO cambia: F3 emite `invalid`, `not_found`,
# `conflict`, `forbidden`, `unauthenticated` e `internal`, todos ya en el enum.
# En particular, una subida de imagen inválida o demasiado grande es
# `400 invalid` con `details.file`/`details.fileSize` (no se añade `payload_too_large`).
#
# CAMBIOS EN ESQUEMAS EXISTENTES (aplicar en la fusión; son aditivos):
#   - AdminActionItem.action: el enum crece con los 15 códigos `home.*`
#     (research R3-11.1): home.identity.update, home.about.update,
#     home.contact.update, home.schedule.create/.update/.delete,
#     home.whatsapp.create/.update/.delete, home.social.create/.update/.delete,
#     home.image.upload, home.publish, home.unpublish. Regla exacta (analyze M5):
#     el alta usa `home.*.create` aunque nazca publicada; `home.publish`/
#     `home.unpublish` SOLO registran cambios de estado; la subida de imagen se
#     audita con `home.image.upload` (analyze I8).
#   - AdminActionItem.targetKind: el enum crece con `content` (elemento de la
#     portada). Para `content`, `targetId` es `null` (los elementos de la portada
#     no tienen FK en admin_actions) y `targetLabel` identifica el elemento
#     ("Portada · <Sección> · <nombre>").
#
# NORMALIZACIÓN DE CAMPOS `*En` (analyze I6): todo campo `*En` (traducción al
# inglés, opcional) acepta `""` o solo espacios y el servidor lo guarda como
# `null` (trim antes de persistir). `null`/`""` significan "sin traducción" y
# disparan el fallback `en → es` del servidor (FR-009).
#
# Formato uniforme (FR-012/FR-013 de F1): 2xx → el DTO de la operación;
# 4xx/5xx → ErrorEnvelope. Salvedad documentada: GET /api/v1/media/{fileName}
# responde un binario de imagen (200) y usa ErrorEnvelope solo en error.
#
# Convenciones: operaciones en inglés (camelCase), segmentos de URL en español
# donde el dominio lo pide (patrón de arquitectura.md §5.1), campos en
# camelCase con sufijo Es/En para lo traducible (research R3-1),
# additionalProperties: false, fechas ISO-8601 en UTC.
#
# Idioma (research R3-2): la portada pública se resuelve por `?lang=es|en`
# (por defecto `es`, idioma base) con fallback por campo `en → es` en el server:
# NUNCA sale un campo vacío por falta de traducción (FR-009/SC-006).
# Borradores (FR-013): este contrato NO tiene ninguna operación pública que
# devuelva contenido en `draft`; las secciones sin elementos publicados se
# omiten por completo de la respuesta (Q10/SC-012).
# ============================================================================
openapi: 3.1.0
info:
  title: API — Iglesia Simiente Santa
  version: 0.4.0
  description: |
    Delta de F3 (portada e información general) sobre el contrato vivo.

    ## Nuevos en este delta

    - **Portada pública sin autenticación** `GET /api/v1/portada?lang=es|en`
      (FR-001…FR-007): identidad, «quiénes somos», horario de servicios, canales
      de WhatsApp, redes sociales y datos de contacto — **solo contenido
      publicado** (FR-013) y **ya localizado** al idioma pedido con fallback
      `en → es` (FR-009). `Cache-Control: no-store` (los cambios guardados son
      visibles desde la primera carga posterior, FR-014/SC-003).
    - **Archivos de imagen públicos** `GET /api/v1/media/{fileName}` (logo e
      imagen de portada; nombre generado por el servidor, R3-8).
    - **Gestión del módulo en el panel** bajo `/api/v1/admin/portada` (FR-011…FR-015),
      protegida con el permiso del catálogo de F2 `portada` ("Portada e
      información general") verificado **en el servidor** junto con la sesión y el
      CSRF (FR-012): crear/editar/borrar y publicar/retirar **por elemento**
      (FR-013), con versión es (obligatoria) y en (opcional) (FR-008).
    - **Subida de imágenes** `POST /api/v1/admin/portada/imagenes` (multipart;
      solo JPEG/PNG/WebP por firma binaria, máx. 8 MB — research R3-8).
    - Toda edición queda registrada en la auditoría de F2 (FR-017): ver los
      cambios de `AdminActionItem` más arriba.

    ## Códigos que F3 puede devolver (no añade ninguno nuevo)

    | HTTP | `error.code` | Cuándo |
    |---|---|---|
    | 400 | `invalid` | datos inválidos/incompletos (campo obligatorio vacío, español ausente, «quiénes somos» > 1.000, correo/teléfono con formato inválido, URL mal formada o de dominio no permitido, `lang` fuera de `es/en`, archivo con tipo/tamaño no permitido); lleva `details` por campo |
    | 401 | `unauthenticated` | sin sesión válida en operaciones del panel |
    | 403 | `forbidden` | sin el permiso `portada`, o cuenta con cambio de contraseña pendiente |
    | 404 | `not_found` | elemento inexistente (`{id}` de horario/WhatsApp/red) o archivo de imagen inexistente |
    | 409 | `conflict` | red social repetida (ya hay un enlace para esa red) o canal de WhatsApp duplicado exacto |
    | 500 | `internal` | error inesperado (mensaje genérico) |

  contact:
    name: Equipo del proyecto
servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo (Docker Compose)
tags:
  - name: portada
    description: Portada pública (visitante, sin autenticación; solo contenido publicado)
  - name: media
    description: Archivos de imagen publicados (logo e imagen de portada)
  - name: portada-admin
    description: Gestión de la portada desde el panel (permiso `portada` de F2)
paths:
  /api/v1/portada:
    get:
      tags: [portada]
      operationId: getPortada
      summary: Portada pública con la información general publicada
      description: |
        Devuelve la información general **publicada** (FR-001…FR-007) resuelta al
        idioma pedido (FR-008/FR-009): cada campo traducible usa la versión en
        inglés si existe y, si no, la versión en español (idioma base). **Nunca**
        incluye contenido en borrador (FR-013/SC-002) y **omite por completo**
        las secciones sin elementos publicados (Q10/SC-012): cuando una clave de
        sección está presente, sus arrays nunca son `null` (§8.1.2).

        Sin autenticación. `Cache-Control: no-store`. Sin paginación: es un
        documento de una sola página (las colecciones están acotadas en el
        servidor: ≤50 servicios y ≤20 canales de WhatsApp).
      security: []
      parameters:
        - name: lang
          in: query
          required: false
          description: Idioma de resolución de contenidos. Por defecto `es` (idioma base, Decisión 8).
          schema:
            type: string
            enum: [es, en]
            default: es
      responses:
        "200":
          description: Información general publicada, localizada a `lang`.
          headers:
            Cache-Control:
              description: Siempre `no-store` (SC-003: los cambios guardados se ven en la primera carga posterior).
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortadaPublica"
        "400":
          $ref: "#/components/responses/Invalid"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/v1/media/{fileName}:
    get:
      tags: [media]
      operationId: getMediaFile
      summary: Descarga pública de una imagen subida desde el panel
      description: |
        Sirve el archivo de imagen (logo o imagen de portada) cuyo nombre generó
        el servidor en la subida (`img_<uuid>.<ext>`, research R3-8). **Política de
        publicación (FR-013/SC-002, analyze C4)**: solo se sirven archivos
        **referenciados por contenido publicado** — en F3, el logo o la imagen de
        portada de una identidad `published` —. Un archivo que no esté referenciado
        por contenido publicado (elemento retirado a borrador, identidad en
        borrador, subida huérfana o inexistente) responde `404 not_found`, y el
        nombre que no cumple el patrón responde `400 invalid` (analyze M6).

        El nombre se valida con regex antes de tocar el disco (sin *path
        traversal*); la respuesta lleva `X-Content-Type-Options: nosniff`,
        `Content-Disposition: inline` y **`Cache-Control: no-store`** (trade-off
        de RG3-8: al depender la descarga del estado de publicación, una caché
        `immutable` volvería a mostrar imágenes de elementos ya retirados). Sin
        autenticación: la descarga es pública, pero limitada a lo publicado.
      security: []
      parameters:
        - name: fileName
          in: path
          required: true
          description: Nombre del archivo tal como lo devolvió la subida (`fileName` de `ImageUploadResult`).
          schema:
            type: string
            pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
      responses:
        "200":
          description: Binario de imagen (JPEG, PNG o WebP según la firma detectada en la subida).
          headers:
            Cache-Control:
              description: Siempre `no-store` (la descarga depende del estado de publicación, RG3-8).
              schema:
                type: string
                enum: [no-store]
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada:
    get:
      tags: [portada-admin]
      operationId: getPortadaAdmin
      summary: Estado completo de la portada para el panel (incluye borradores)
      description: |
        Devuelve **todo** el contenido del módulo —identidad, «quiénes somos»,
        contacto, horario, canales de WhatsApp y redes— en **ambos idiomas** y
        con su `publicationState` por elemento (FR-011, US3 esc. 7), incluidos los
        borradores (este es el único lado que los ve; exige el permiso `portada`).
        Los singletons (identidad, quiénes somos, contacto) son `null` hasta el
        primer guardado. Cada colección va en su sobre `{items}` (§8.1.2) acotado
        en el servidor (≤50 servicios, ≤20 canales; redes: 1 por red del catálogo).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Estado completo del módulo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortadaAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/v1/admin/portada/identidad:
    put:
      tags: [portada-admin]
      operationId: updateIdentity
      summary: Guarda la identidad de la iglesia (crea o reemplaza el singleton)
      description: |
        Reemplazo completo de la identidad (FR-002/FR-011): nombre oficial,
        lema/misión/visión, logo e imagen de portada con sus textos alternativos
        (FR-019) — versión en español obligatoria y en inglés opcional (FR-008).
        `logoFile`/`coverImageFile` referencian archivos ya subidos con
        `POST /api/v1/admin/portada/imagenes`; un `null` explícito quita la imagen.
        `publicationState` controla la visibilidad del elemento (FR-013); si el
        elemento ya estaba publicado, los cambios guardados son visibles de
        inmediato (FR-014). Auditoría *(analyze M5)*: un cambio de datos registra
        `home.identity.update`; un cambio solo de estado registra
        `home.publish`/`home.unpublish`; un cambio que modifica **datos y estado**
        deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityInput"
      responses:
        "200":
          description: Identidad guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/quienes-somos:
    put:
      tags: [portada-admin]
      operationId: updateAbout
      summary: Guarda el texto de «quiénes somos» (crea o reemplaza el singleton)
      description: |
        Texto **plano** con límite de 1.000 caracteres por idioma (FR-003):
        `textEs` obligatorio, `textEn` opcional (FR-008). Se guarda íntegro, sin
        interpretar (constitución §IV). Auditoría *(analyze M5)*: un cambio de datos
        registra `home.about.update`; un cambio solo de estado registra
        `home.publish`/`home.unpublish`; un cambio que modifica **datos y estado**
        deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutInput"
      responses:
        "200":
          description: Texto guardado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/contacto:
    put:
      tags: [portada-admin]
      operationId: updateContact
      summary: Guarda los datos de contacto (crea o reemplaza el singleton)
      description: |
        Dirección física (es obligatoria, en opcional), correo electrónico y
        teléfono (FR-007), todos obligatorios salvo la traducción (FR-015):
        correo con formato de correo y teléfono con el criterio de F2. Auditoría
        *(analyze M5)*: un cambio de datos registra `home.contact.update`; un cambio
        solo de estado registra `home.publish`/`home.unpublish`; un cambio que
        modifica **datos y estado** deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "200":
          description: Datos de contacto guardados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/horario:
    post:
      tags: [portada-admin]
      operationId: createScheduleItem
      summary: Crea un servicio del horario
      description: |
        Un servicio tiene día (0=domingo…6=sábado, **selector localizado por i18n,
        nunca texto libre**), inicio "HH:MM" (24 h) y **fin opcional** `endTime`
        ("HH:MM", posterior al inicio) para rangos tipo «10:00 a. m. − 12:00 m.»;
        nombre/descripción y lugar son traducibles (FR-004/Q3): nombre y lugar en
        español son obligatorios, todo lo demás traducible es opcional (FR-008).
        Nace en `draft` salvo que se envíe `publicationState: published`. Máximo 50
        servicios (constante del servidor). Auditoría *(analyze M5)*: el alta
        registra **siempre** `home.schedule.create`, aunque nazca publicada
        (`home.publish`/`home.unpublish` solo registran cambios de estado, FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "201":
          description: Servicio creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItemAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/horario/{id}:
    patch:
      tags: [portada-admin]
      operationId: updateScheduleItem
      summary: Edita un servicio del horario (y/o lo publica o retira)
      description: |
        Actualiza los campos presentes (al menos uno). `publicationState` publica
        o retira **este** elemento por separado (FR-013). Sobre un elemento ya
        publicado, los cambios guardados son visibles de inmediato (FR-014).
        Auditoría *(analyze M5)*: un cambio de datos registra `home.schedule.update`;
        un cambio solo de estado registra `home.publish`/`home.unpublish`; un cambio
        que modifica **datos y estado** deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemPatch"
      responses:
        "200":
          description: Servicio guardado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItemAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [portada-admin]
      operationId: deleteScheduleItem
      summary: Elimina un servicio del horario
      description: |
        Borrado físico (sin historial, Assumptions de la spec). El registro de
        auditoría conserva `targetLabel` del elemento (FR-017/FR-025 de F2).
        Auditoría: `home.schedule.delete`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      responses:
        "204":
          description: Servicio eliminado (sin cuerpo).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/whatsapp:
    post:
      tags: [portada-admin]
      operationId: createWhatsappChannel
      summary: Crea un canal de WhatsApp
      description: |
        Un canal tiene nombre/propósito (es obligatorio) y **un único destino**
        (FR-005/Q4): `kind=direct` + número de teléfono (se normaliza a dígitos
        con `+` opcional y el visitante abre `https://wa.me/<dígitos>`) o
        `kind=group` + URL `https` de `chat.whatsapp.com`/`wa.me` (FR-015).
        Un canal exactamente igual a otro (mismo `kind`, destino y nombre
        normalizados) se rechaza como duplicado (edge case de la spec). Máximo 20
        canales. Auditoría: `home.whatsapp.create` (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappChannelInput"
      responses:
        "201":
          description: Canal creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappChannelAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/whatsapp/{id}:
    patch:
      tags: [portada-admin]
      operationId: updateWhatsappChannel
      summary: Edita un canal de WhatsApp (y/o lo publica o retira)
      description: |
        Igual que `updateScheduleItem` para un canal de WhatsApp (FR-005/FR-013/FR-014).
        Auditoría *(analyze M5)*: un cambio de datos registra `home.whatsapp.update`;
        un cambio solo de estado registra `home.publish`/`home.unpublish`; un cambio
        que modifica **datos y estado** deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappChannelPatch"
      responses:
        "200":
          description: Canal guardado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappChannelAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [portada-admin]
      operationId: deleteWhatsappChannel
      summary: Elimina un canal de WhatsApp
      description: Borrado físico. Auditoría: `home.whatsapp.delete` (FR-017).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      responses:
        "204":
          description: Canal eliminado (sin cuerpo).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/redes:
    post:
      tags: [portada-admin]
      operationId: createSocialLink
      summary: Crea el enlace de una red social
      description: |
        Catálogo fijo (FR-006/Q5): `facebook`, `instagram`, `youtube`, `tiktok` o
        `spotify`, con **un solo enlace por red**. Una red fuera del catálogo se
        rechaza (`400`, `details.network`) y un segundo enlace para la misma red
        responde `409`. La URL debe ser `https` del dominio oficial de esa red.
        Auditoría: `home.social.create` (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkInput"
      responses:
        "201":
          description: Enlace creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLinkAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/redes/{id}:
    patch:
      tags: [portada-admin]
      operationId: updateSocialLink
      summary: Edita el enlace de una red social (y/o lo publica o retira)
      description: |
        Igual que `updateScheduleItem` para un enlace de red (FR-006/FR-013/FR-014).
        Auditoría *(analyze M5)*: un cambio de datos registra `home.social.update`;
        un cambio solo de estado registra `home.publish`/`home.unpublish`; un cambio
        que modifica **datos y estado** deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkPatch"
      responses:
        "200":
          description: Enlace guardado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLinkAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [portada-admin]
      operationId: deleteSocialLink
      summary: Elimina el enlace de una red social
      description: Borrado físico. Auditoría: `home.social.delete` (FR-017).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      responses:
        "204":
          description: Enlace eliminado (sin cuerpo).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/imagenes:
    post:
      tags: [portada-admin]
      operationId: uploadPortadaImage
      summary: Sube el logotipo o la imagen de portada
      description: |
        Recibe `multipart/form-data` con el campo `file`. El servidor **genera el
        nombre** (`img_<uuid>.<ext>`), detecta el tipo por **firma binaria** y solo
        admite `image/jpeg`, `image/png` e `image/webp` (sin SVG ni GIF: research
        R3-8), con tope de 8 MB (`UPLOAD_MAX_BYTES`). El resultado se referencia
        desde `PUT /api/v1/admin/portada/identidad` (`logoFile`/`coverImageFile`).
        La subida **no** cambia contenido visible: no aparece en la portada hasta
        que la identidad que la referencia se guarda publicada. Auditoría
        *(analyze I8)*: cada subida deja su fila **`home.image.upload`**
        (`targetLabel` = `Portada · Imagen · <fileName>`) en la misma operación
        (fail-closed: si el registro falla, se aborta la subida y se elimina el
        archivo); la referencia a la identidad se registra aparte con
        `home.identity.update` al guardar. Los archivos huérfanos (subidas sin
        referencia) se eliminan con el reemplazo/borrado best-effort del servicio.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo de imagen (JPEG/PNG/WebP, ≤8 MB).
              additionalProperties: false
      responses:
        "201":
          description: Archivo almacenado; `url` es relativa al origen de la API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

components:
  parameters:
    PortadaItemId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del elemento de la portada.
      schema:
        type: string
        format: uuid

  schemas:
    PublicationState:
      type: string
      enum: [draft, published]
      description: |
        Estado de publicación **por elemento** (FR-013, Decisión 4): `draft` no es
        visible para el visitante; `published` sí. Se publica al guardar (FR-014).

    # ---------------------------------------------------------------- público
    PortadaPublica:
      type: object
      required: [lang]
      description: |
        Información general publicada, resuelta a `lang` (fallback `en → es` por
        campo, FR-009). Las claves de sección están presentes **solo** si tienen
        elementos publicados (Q10/SC-012); si están presentes, sus arrays nunca
        son `null`. `identity`, `about` y `contact` son objetos únicos (FR-002,
        FR-003, FR-007).
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        identity:
          $ref: "#/components/schemas/IdentityPublic"
        about:
          $ref: "#/components/schemas/AboutPublic"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleItemPublic"
        whatsapp:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappChannelPublic"
        socials:
          type: array
          items:
            $ref: "#/components/schemas/SocialLinkPublic"
        contact:
          $ref: "#/components/schemas/ContactPublic"
      additionalProperties: false

    IdentityPublic:
      type: object
      required: [name]
      description: Identidad publicada (FR-002), ya localizada a `lang`.
      properties:
        name:
          type: string
          maxLength: 160
          description: Nombre oficial de la iglesia.
        tagline:
          type: string
          maxLength: 300
        mission:
          type: string
          maxLength: 600
        vision:
          type: string
          maxLength: 600
        logoUrl:
          type: string
          description: URL relativa al origen de la API (`/api/v1/media/<file>`).
        logoAlt:
          type: string
          maxLength: 300
          description: Texto alternativo del logotipo (FR-019).
        coverImageUrl:
          type: string
          description: URL relativa al origen de la API (`/api/v1/media/<file>`).
        coverImageAlt:
          type: string
          maxLength: 300
      additionalProperties: false

    AboutPublic:
      type: object
      required: [text]
      description: «Quiénes somos» publicado (FR-003), texto plano ya localizado.
      properties:
        text:
          type: string
          maxLength: 1000
      additionalProperties: false

    ScheduleItemPublic:
      type: object
      required: [id, dayOfWeek, startTime, name, place]
      description: Servicio del horario publicado (FR-004), ya localizado.
      properties:
        id:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo … 6 = sábado. El nombre del día lo localiza el cliente.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Hora de inicio ("HH:MM", 24 h).
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", 24 h; posterior a `startTime`) para
            rangos tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        name:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 400
        place:
          type: string
          maxLength: 200
      additionalProperties: false

    WhatsappChannelPublic:
      type: object
      required: [id, name, kind, url]
      description: |
        Canal de WhatsApp publicado (FR-005), ya localizado. `url` es el enlace
        listo para abrir el canal: `https://wa.me/<dígitos>` para `direct`, o la
        URL del grupo para `group` (SC-009: se abre con un clic o toque).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
          description: Nombre/propósito del canal.
        kind:
          type: string
          enum: [direct, group]
        url:
          type: string
          format: uri
      additionalProperties: false

    SocialLinkPublic:
      type: object
      required: [id, network, url]
      description: Red social publicada (FR-006), un enlace por red del catálogo.
      properties:
        id:
          type: string
          format: uuid
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
      additionalProperties: false

    ContactPublic:
      type: object
      required: [address, email, phone]
      description: Datos de contacto publicados (FR-007), ya localizados.
      properties:
        address:
          type: string
          maxLength: 300
        email:
          type: string
          format: email
        phone:
          type: string
      additionalProperties: false

    # ------------------------------------------------------------------ panel
    PortadaAdmin:
      type: object
      required: [identity, about, contact, schedule, whatsapp, socials]
      description: |
        Estado completo del módulo (FR-011), en **ambos idiomas** y con
        `publicationState` por elemento. Los singletons son `null` hasta el primer
        guardado. Cada colección va en su sobre `{items}` (§8.1.2).
      properties:
        identity:
          oneOf:
            - $ref: "#/components/schemas/IdentityAdmin"
            - type: "null"
        about:
          oneOf:
            - $ref: "#/components/schemas/AboutAdmin"
            - type: "null"
        contact:
          oneOf:
            - $ref: "#/components/schemas/ContactAdmin"
            - type: "null"
        schedule:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ScheduleItemAdmin"
          additionalProperties: false
        whatsapp:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WhatsappChannelAdmin"
          additionalProperties: false
        socials:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SocialLinkAdmin"
          additionalProperties: false
      additionalProperties: false

    IdentityAdmin:
      type: object
      required: [nameEs, publicationState, createdAt, updatedAt]
      description: Identidad con sus dos idiomas (es obligatorio, en opcional, FR-008).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        taglineEs:
          type: [string, "null"]
          maxLength: 300
        taglineEn:
          type: [string, "null"]
          maxLength: 300
        missionEs:
          type: [string, "null"]
          maxLength: 600
        missionEn:
          type: [string, "null"]
          maxLength: 600
        visionEs:
          type: [string, "null"]
          maxLength: 600
        visionEn:
          type: [string, "null"]
          maxLength: 600
        logoFile:
          type: [string, "null"]
          description: Nombre del archivo del logotipo (`img_<uuid>.<ext>`).
        logoAltEs:
          type: [string, "null"]
          maxLength: 300
        logoAltEn:
          type: [string, "null"]
          maxLength: 300
        coverImageFile:
          type: [string, "null"]
        coverImageAltEs:
          type: [string, "null"]
          maxLength: 300
        coverImageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    IdentityInput:
      type: object
      required: [nameEs, publicationState]
      description: |
        Reemplazo completo (PUT). `nameEs` obligatorio (FR-015); el resto, con
        traducción en inglés opcional (FR-008). Todo campo `*En` acepta `""`/solo
        espacios y se guarda como `null` (analyze I6). `logoFile`/`coverImageFile`
        referencian archivos ya subidos; si hay imagen, `logoAltEs`/
        `coverImageAltEs` son obligatorios (FR-019). `null` explícito quita la
        imagen correspondiente.
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        taglineEs:
          type: [string, "null"]
          maxLength: 300
        taglineEn:
          type: [string, "null"]
          maxLength: 300
        missionEs:
          type: [string, "null"]
          maxLength: 600
        missionEn:
          type: [string, "null"]
          maxLength: 600
        visionEs:
          type: [string, "null"]
          maxLength: 600
        visionEn:
          type: [string, "null"]
          maxLength: 600
        logoFile:
          type: [string, "null"]
          maxLength: 120
        logoAltEs:
          type: [string, "null"]
          maxLength: 300
        logoAltEn:
          type: [string, "null"]
          maxLength: 300
        coverImageFile:
          type: [string, "null"]
          maxLength: 120
        coverImageAltEs:
          type: [string, "null"]
          maxLength: 300
        coverImageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    AboutAdmin:
      type: object
      required: [textEs, publicationState, createdAt, updatedAt]
      properties:
        textEs:
          type: string
          minLength: 1
          maxLength: 1000
        textEn:
          type: [string, "null"]
          maxLength: 1000
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    AboutInput:
      type: object
      required: [textEs, publicationState]
      description: Texto plano (FR-003); `textEs` obligatorio y ≤1.000 caracteres (FR-015). `textEn` acepta `""`/espacios y se guarda como `null` (analyze I6).
      properties:
        textEs:
          type: string
          minLength: 1
          maxLength: 1000
        textEn:
          type: [string, "null"]
          maxLength: 1000
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    ContactAdmin:
      type: object
      required: [addressEs, email, phone, publicationState, createdAt, updatedAt]
      properties:
        addressEs:
          type: string
          minLength: 1
          maxLength: 300
        addressEn:
          type: [string, "null"]
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          description: Formato telefónico de F2 (dígitos, separadores habituales, `+` opcional, ≥7 dígitos).
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    ContactInput:
      type: object
      required: [addressEs, email, phone, publicationState]
      description: Dirección, correo y teléfono son obligatorios (FR-015); `addressEn` opcional (`""`/espacios → `null`, analyze I6).
      properties:
        addressEs:
          type: string
          minLength: 1
          maxLength: 300
        addressEn:
          type: [string, "null"]
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    ScheduleItemAdmin:
      type: object
      required: [id, dayOfWeek, startTime, nameEs, placeEs, publicationState, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", posterior a `startTime`) para rangos
            tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: [string, "null"]
          maxLength: 400
        descriptionEn:
          type: [string, "null"]
          maxLength: 400
        placeEs:
          type: string
          minLength: 1
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
          description: Orden de presentación (por defecto 0; se muestra por `sortOrder, id`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    ScheduleItemInput:
      type: object
      required: [dayOfWeek, startTime, nameEs, placeEs]
      description: |
        Alta de un servicio (FR-004/FR-015): día (0–6, selector localizado, nunca
        texto libre), inicio y nombre/lugar en español obligatorios; **`endTime`
        (fin "HH:MM") es opcional** para rangos (analyze C2), al igual que la
        descripción y las traducciones al inglés (`""`/espacios → `null`, analyze
        I6). Sin `id` (lo genera el servidor) ni `createdAt`/`updatedAt`.
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", posterior a `startTime`) para rangos
            tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: [string, "null"]
          maxLength: 400
        descriptionEn:
          type: [string, "null"]
          maxLength: 400
        placeEs:
          type: string
          minLength: 1
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    ScheduleItemPatch:
      type: object
      minProperties: 1
      description: |
        Edición parcial de un servicio: se actualizan los campos presentes (al
        menos uno). Un campo `*En` con `null` o `""`/espacios vacía su traducción
        al inglés (analyze I6); `endTime: null` quita la hora de fin.
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", posterior a `startTime`) para rangos
            tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: [string, "null"]
          maxLength: 400
        descriptionEn:
          type: [string, "null"]
          maxLength: 400
        placeEs:
          type: string
          minLength: 1
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    WhatsappChannelAdmin:
      type: object
      required: [id, nameEs, kind, destination, publicationState, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        kind:
          type: string
          enum: [direct, group]
        destination:
          type: string
          maxLength: 320
          description: |
            Destino único del canal (FR-005): teléfono normalizado (`direct`) o
            URL del grupo (`group`).
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    WhatsappChannelInput:
      type: object
      required: [nameEs, kind, destination]
      description: |
        Alta de un canal (FR-005/FR-015). `kind=direct` exige teléfono con
        formato válido; `kind=group` exige URL `https` de `chat.whatsapp.com` o
        `wa.me`. El duplicado exacto (kind + destino + nombre normalizados) → 409.
        `nameEn` acepta `""`/espacios y se guarda como `null` (analyze I6).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        kind:
          type: string
          enum: [direct, group]
        destination:
          type: string
          minLength: 1
          maxLength: 320
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    WhatsappChannelPatch:
      type: object
      minProperties: 1
      description: Edición parcial de un canal (al menos un campo presente). `nameEn` acepta `""`/espacios y se guarda como `null` (analyze I6).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        kind:
          type: string
          enum: [direct, group]
        destination:
          type: string
          minLength: 1
          maxLength: 320
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    SocialNetwork:
      type: string
      enum: [facebook, instagram, youtube, tiktok, spotify]
      description: |
        Catálogo fijo de redes (FR-006/Q5). Añadir una red equivalente (p. ej. X)
        es un ajuste menor acordado con el humano: migración que extiende el
        `CHECK` + dominio permitido en el service.

    SocialLinkAdmin:
      type: object
      required: [id, network, url, publicationState, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    SocialLinkInput:
      type: object
      required: [network, url]
      description: |
        Alta del enlace de una red (FR-006/FR-015): red del catálogo y URL `https`
        del dominio oficial de esa red. Un segundo enlace para la misma red → 409.
      properties:
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    SocialLinkPatch:
      type: object
      minProperties: 1
      description: Edición parcial del enlace de una red (al menos un campo presente).
      properties:
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    ImageUploadResult:
      type: object
      required: [fileName, url, mimeType, sizeBytes]
      description: Resultado de una subida (research R3-8). `url` es relativa al origen de la API.
      properties:
        fileName:
          type: string
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
        url:
          type: string
          description: "`/api/v1/media/<fileName>`"
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 8388608
      additionalProperties: false
