        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappChannelPatch"
      responses:
        "200":
          description: Canal guardado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappChannelAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [portada-admin]
      operationId: deleteWhatsappChannel
      summary: Elimina un canal de WhatsApp
      description: "Borrado físico. Auditoría: `home.whatsapp.delete` (FR-017)."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      responses:
        "204":
          description: Canal eliminado (sin cuerpo).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
