        imageAltEs:
          type: [string, "null"]
          maxLength: 300
        imageAltEn:
          type: [string, "null"]
          maxLength: 300
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false
    CategoriaAdmin:
      type: object
      required: [id, nameEs, sortOrder, createdAt, updatedAt]
      description: "Categoría del catálogo (Q6): nombre es obligatorio, en opcional."
      properties:
        id:
          type: string
          format: uuid
        nameEs:
          type: string
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        sortOrder:
          type: integer
          description: Orden de presentación del catálogo (por defecto 0).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    CategoriaInput:
      type: object
      required: [nameEs]
      description: Alta en el catálogo de categorías.
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        sortOrder:
          type: integer
      additionalProperties: false
    CategoriaPatch:
      type: object
      description: Edición parcial de una categoría (solo los campos presentes).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        sortOrder:
          type: integer
      additionalProperties: false

    # ------------------------------------------------------------ comunes
    WhatsappUrl:
      type: string
      maxLength: 500
      pattern: "^https://[^\\s]+$"
      description: |
        Enlace al grupo de WhatsApp (Q2/FR-015): **opcional**; cuando existe es
        **cualquier `https` válido y seguro**, sin restricción de dominios (Q3).
        El servidor rechaza `javascript:`, `data:`, `vbscript:` y cualquier
        esquema distinto de `https`, y **no transforma** el valor: el enlace
        mostrado es exactamente el guardado. Su vigencia no se verifica.

    # ------------------------------------------------------------- público
    MinisteriosPublicos:
      type: object
      required: [lang]
      description: |
        Ministerios publicados, resueltos a `lang` (FR-002/FR-008). `items` está
        presente **solo** si hay ministerios publicados; vacío/ausente significa
        "no hay nada publicado" y la navegación oculta la entrada, la portada no
        renderiza el bloque y la ruta SPA `/ministerios` redirige a la portada
        (FR-005/FR-028/SC-010; la redirección es del frontend — P6-21 del plan —
        y este documento sigue siendo `200` con `items` omitida). Nunca es
        `null` (§8.1.2) y está acotada a **200** elementos (constante de
        seguridad del servidor). Orden: `sortOrder`, `id` (FR-004).
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MinisterioPublico"
      additionalProperties: false
    MinisterioPublico:
      type: object
      required: [id, name, description]
      description: |
        Ministerio **publicado** para el visitante (FR-002). `name` y
        `description` están siempre; el resto de claves son **opcionales y se
        omiten cuando el dato no existe** (SC-010/SC-017: sin líneas vacías ni
        botones rotos). `leader` **solo aparece** cuando el equipo publicó la
        ficha del encargado (`leaderVisible`) y hay encargado con nombre
        (FR-025/FR-026): con la ficha no publicada, esta respuesta **no contiene**
        el nombre ni el celular/correo del encargado en ninguna forma.
        `whatsappUrl` solo aparece si existe (el visitante no debe ver un botón
        de unión vacío: FR-003/SC-009).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
          description: Nombre del ministerio, ya localizado a `lang` (puede provenir del español por fallback).
        description:
          type: string
          maxLength: 2000
          description: Descripción, texto plano multilínea (≤2.000 caracteres), ya localizada.
        schedule:
          type: string
          maxLength: 200
          description: |
            Horario como **texto libre** (Q6/FR-024; p. ej. «Todos los viernes,
            7:00 p. m.», «Una vez al mes, fecha variable»). No es una fecha ni
            una recurrencia: el sistema no calcula nada a partir de él. Ya
            localizado. Ausente si no existe.
        place:
          type: string
          maxLength: 200
          description: Lugar como texto libre, ya localizado. Ausente si no existe.
        leader:
          $ref: "#/components/schemas/LiderPublico"
          description: |
            Ficha del encargado (nombre y, cuando existe, su único medio de
            contacto). **Solo presente si `leaderVisible` y hay encargado**:
            con la ficha no publicada, esta clave no existe y ningún dato del
            encargado viaja en la respuesta (FR-026/SC-014).
        whatsappUrl:
          allOf:
            - $ref: "#/components/schemas/WhatsappUrl"
          description: Enlace al grupo de WhatsApp para unirse (FR-003). Ausente si el ministerio no tiene enlace.
        image:
          $ref: "#/components/schemas/ImagenPublica"
          description: Imagen opcional con su texto alternativo (FR-020); misma URL relativa `/api/v1/media/<file>`.
      additionalProperties: false
    LiderPublico:
      type: object
      required: [name]
      description: |
        Ficha **publicada** del encargado (FR-025/Q1/Q8/Q9): nombre y, como
        mucho, **un** medio de contacto (celular **o** correo). Si el encargado
        se guardó solo con nombre, esta ficha trae solo `name` y no es un error
        (Q8). Solo se construye cuando `leaderVisible` está activo (FR-026).
      properties:
        name:
          type: string
          maxLength: 160
          description: Nombre del encargado, ya localizado a `lang`.
        phone:
          type: string
          maxLength: 32
          description: Número de celular (único medio de contacto si existe). Nunca viaja junto a `email`.
        email:
          type: string
          maxLength: 254
          description: Correo electrónico (único medio de contacto si existe). Nunca viaja junto a `phone`.
      additionalProperties: false
    PortadaMinisterios:
      type: object
      required: [lang]
      description: |
        Bloque de ministerios de la portada (US6, FR-027…FR-029): hasta **5**
        ítems publicados en el orden manual (tope firme del servidor).
        `items` está presente **solo** si hay ministerios publicados; sin
        ninguno la portada **no renderiza el bloque** (FR-028: sin mensaje, a
        diferencia del bloque «Lo que viene» de F4). Nunca es `null`.
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ItemMinisterioPortada"
      additionalProperties: false
    ItemMinisterioPortada:
      type: object
      required: [id, name]
      description: |
        Ítem del bloque de la portada: **solo** lo que la tarjeta compacta
        muestra (FR-027 y `ux.md` §4.9: imagen + nombre, con `schedule`/`place`
        cuando existen; el detalle —descripción, encargado y enlace— vive en
        `/ministerios`). **No tiene campos de encargado**: la privacidad de
        FR-026 es estructural en esta ruta. `image`, `schedule` y `place` se
        omiten si el ministerio no los tiene (la tarjeta se compone sin huecos —
        SC-016/SC-017 —).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        schedule:
          type: string
          maxLength: 200
          description: Horario como texto libre, ya localizado (Q6/FR-024). Ausente si no existe.
        place:
          type: string
          maxLength: 200
          description: Lugar como texto libre, ya localizado. Ausente si no existe.
        image:
          $ref: "#/components/schemas/ImagenPublica"
      additionalProperties: false

    # ------------------------------------------------------------- panel
    MinisterioAdminList:
      type: object
      required: [items, total, limit, offset]
      description: Listado paginado de ministerios del panel (§8.1.2/§8.1.3).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MinisterioAdmin"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      additionalProperties: false
    MinisterioAdmin:
      type: object
      required:
        [id, nameEs, descriptionEs, leaderVisible, publicationState, sortOrder,
         whatsappUrlShared, createdAt, updatedAt]
      description: |
        Ministerio completo del panel (FR-010/FR-019): ambos idiomas (es
        obligatorio por campo relleno, en opcional), la ficha del encargado
        **íntegra aunque no esté publicada** (dato guardado ≠ dato publicado) y
        el estado. `whatsappUrlShared` señala —sin bloquear— que otro ministerio
        usa el mismo enlace (R6-11).
      properties:
        id:
          type: string
          format: uuid
        nameEs:
          type: string
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: string
          maxLength: 2000
        descriptionEn:
          type: [string, "null"]
          maxLength: 2000
        leaderNameEs:
          type: [string, "null"]
          maxLength: 160
          description: Nombre del encargado en español (opcional; Q1).
        leaderNameEn:
          type: [string, "null"]
          maxLength: 160
        leaderPhone:
          type: [string, "null"]
          maxLength: 32
          description: Celular del encargado (opcional; **nunca** junto a `leaderEmail`, Q8).
        leaderEmail:
          type: [string, "null"]
          maxLength: 254
          description: Correo del encargado (opcional; **nunca** junto a `leaderPhone`, Q8).
        leaderVisible:
          type: boolean
          description: |
            Interruptor de publicación de la ficha del encargado (FR-025/Q9;
            equivale al `showContact` de la spec): `false` = nombre y contacto
            **no publicados** (no salen del servidor hacia el público, FR-026),
            `true` = la ficha se publica tal cual. No borra ni edita los datos.
            Un ministerio nuevo nace con `false` («Oculto por defecto»,
            decisión del humano 2026-10-13). Es un interruptor **propio de F6**
            (F3/F4 no lo tienen).
        whatsappUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^https://[^\\s]+$"
          description: |
            Enlace al grupo de WhatsApp (Q2/FR-015): `null` cuando el
            ministerio no tiene enlace (el panel recibe la clave siempre, de
            forma explícita). Cuando existe es **cualquier `https` válido y
            seguro**, sin restricción de dominios (Q3); el valor se sirve tal
            cual, sin transformar.
        whatsappUrlShared:
          type: boolean
          description: |
            `true` si **otro** ministerio usa el mismo `whatsappUrl` (grupo
            compartido). Es un aviso **no bloqueante** (R6-11): el guardado
            procede y la interfaz lo señala.
        scheduleEs:
          type: [string, "null"]
          maxLength: 200
          description: Horario en texto libre (Q6/FR-024); sin fechas ni recurrencia.
        scheduleEn:
          type: [string, "null"]
          maxLength: 200
        placeEs:
          type: [string, "null"]
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        imageFile:
          type: [string, "null"]
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
        imageAltEs:
          type: [string, "null"]
          maxLength: 300
        imageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
          description: Valor de orden del módulo (Q5/FR-004/FR-016); el visitante ve `sortOrder`, `id`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    MinisterioInput:
      type: object
      required: [nameEs, descriptionEs]
      description: |
        Alta de ministerio (FR-014/FR-019): **solo `nameEs` y `descriptionEs`
        son obligatorios** (Q1/Q2/Q6/Q8: encargado, contacto, enlace, horario,
        lugar e imagen son opcionales). `publicationState` por defecto `draft`;
        `sortOrder` por defecto 0. Reglas por campo: `*En` exige su `*Es`;
        `leaderPhone` y `leaderEmail` nunca juntos y exigen `leaderNameEs`;
        `imageAltEs` obligatorio si hay `imageFile`; `whatsappUrl` solo `https`
        (FR-015). `leaderVisible` por defecto **`false`** («Oculto por defecto»,
        decisión del humano 2026-10-13: privacidad por defecto).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: string
          minLength: 1
          maxLength: 2000
        descriptionEn:
          type: [string, "null"]
          maxLength: 2000
        leaderNameEs:
          type: [string, "null"]
          maxLength: 160
        leaderNameEn:
          type: [string, "null"]
          maxLength: 160
        leaderPhone:
          type: [string, "null"]
          maxLength: 32
          description: "Celular del encargado (tag `phone`: formato de teléfono, ≥7 dígitos). Nunca con `leaderEmail`."
        leaderEmail:
          type: [string, "null"]
          maxLength: 254
          description: Correo del encargado (tag `email`). Nunca con `leaderPhone`.
        leaderVisible:
          type: boolean
          default: false
          description: |
            Publica (o no) la ficha del encargado —nombre y contacto—
            (FR-025/FR-026). **Por defecto `false`** («Oculto por defecto»,
            decisión del humano 2026-10-13): si falta la clave, la ficha nace
            **no publicada** y ningún dato del encargado sale hacia el público.
        whatsappUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^https://[^\\s]+$"
          description: |
            Enlace opcional al grupo de WhatsApp (Q2/FR-015); solo `https`
            válido y seguro, sin restricción de dominios (Q3). `null` (o
            ausente) = sin enlace: el servidor normaliza `""`/espacios a
            `null`.
        scheduleEs:
          type: [string, "null"]
          maxLength: 200
        scheduleEn:
          type: [string, "null"]
          maxLength: 200
        placeEs:
          type: [string, "null"]
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        imageFile:
          type: [string, "null"]
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
          description: Nombre devuelto por `POST /api/v1/admin/ministerios/imagenes`.
        imageAltEs:
          type: [string, "null"]
          maxLength: 300
          description: Obligatorio si hay `imageFile` (FR-020).
        imageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
          description: Valor de orden (por defecto 0; Q5).
      additionalProperties: false
    MinisterioPatch:
      type: object
      minProperties: 1
      description: |
        Edición parcial: solo los campos presentes se modifican. Un campo con
        `null` explícito borra su valor opcional (p. ej. `whatsappUrl`,
        `imageFile`, `leaderPhone`, `scheduleEs`). Las mismas reglas de
        coherencia que el alta se aplican sobre el resultado (el servidor
        valida el ministerio **ya fusionado**): `*En` exige su `*Es`, contacto
        sin nombre inválido, celular y correo nunca juntos, `imageAltEs` con
        imagen, enlace solo `https`. `leaderVisible` publica u oculta la ficha
        sin tocar los datos (US2 esc. 10–11).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: string
          minLength: 1
          maxLength: 2000
        descriptionEn:
          type: [string, "null"]
          maxLength: 2000
        leaderNameEs:
          type: [string, "null"]
          maxLength: 160
        leaderNameEn:
          type: [string, "null"]
          maxLength: 160
        leaderPhone:
          type: [string, "null"]
          maxLength: 32
        leaderEmail:
          type: [string, "null"]
          maxLength: 254
        leaderVisible:
          type: boolean
        whatsappUrl:
          type: [string, "null"]
          maxLength: 500
          pattern: "^https://[^\\s]+$"
          description: |
            Enlace al grupo de WhatsApp (Q2/FR-015); solo `https` válido y
            seguro, sin restricción de dominios (Q3). Un `null` explícito lo
            borra; ausente no lo toca.
        scheduleEs:
          type: [string, "null"]
          maxLength: 200
        scheduleEn:
          type: [string, "null"]
          maxLength: 200
        placeEs:
          type: [string, "null"]
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        imageFile:
          type: [string, "null"]
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
        imageAltEs:
          type: [string, "null"]
          maxLength: 300
        imageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

  responses:
    NotFound:
      description: Ruta no documentada. El fallback del router responde este sobre (la stdlib respondería texto).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: not_found
              message: Recurso no encontrado
    MethodNotAllowed:
      description: Método no documentado para la ruta (p. ej. `POST /healthz`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: method_not_allowed
              message: Método no permitido
    Internal:
      description: |
        Error inesperado. El mensaje es genérico a propósito (FR-013): el
        detalle interno queda registrado en el log estructurado con su
        `request_id` para diagnóstico.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: internal
              message: Error interno del servidor
    DatabaseUnavailable:
      description: |
        Servicio vivo, base de datos NO conectada (fallo previsible de
        `/healthz`; FR-004). La respuesta llega en ≤2 s por el timeout del ping.
      headers:
        Cache-Control:
          description: El estado nunca debe ser cacheado por intermediarios.
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: database_unavailable
              message: La base de datos no está conectada
              details:
                database: disconnected

    Invalid:
      description: |
        Datos inválidos o incompletos, o contraseña que no cumple la política
        (FR-010). `details` indica qué campo corregir; nunca expone información
        interna.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: invalid
              message: Revisa los datos del formulario
              details:
                email: no tiene un formato de correo válido
    Unauthenticated:
      description: |
        Sin sesión válida (expirada por inactividad, cerrada o inexistente) o
        credenciales de inicio de sesión incorrectas. El mensaje de login es
        genérico y **no** revela si la cuenta existe (FR-003).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unauthenticated
              message: Correo o contraseña incorrectos
    Forbidden:
      description: |
        Autenticado pero sin permiso para la operación (FR-016), o cuenta
        desactivada al iniciar sesión (US1 esc. 3), o con la obligación de
        cambiar la contraseña antes de usar el panel (en cuyo caso
        `details.reason = "password_change_required"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: forbidden
              message: No tienes permiso para realizar esta operación
    Conflict:
      description: |
        Conflicto con el estado actual: correo o nombre de rol duplicado (Q5),
        rol con cuentas asignadas al intentar eliminarlo (FR-017), inicialización
        ya ejecutada (FR-007) u operación que dejaría el panel sin administración
        (FR-008, en cuyo caso `details.reason = "admin_required"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: conflict
              message: Ese correo ya está en uso
    TooManyRequests:
      description: |
        Demasiadas peticiones: bloqueo temporal por intentos fallidos de inicio
        de sesión (creado por el **5.º fallo**; cada intento desde el **6.º** y
        durante 15 minutos recibe esta respuesta, FR-006) o `rate-limit` por IP.
        El mensaje de bloqueo es idéntico exista o no la cuenta (FR-003).
      headers:
        Retry-After:
          description: Segundos hasta que se pueda volver a intentar.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: rate_limited
              message: Demasiados intentos fallidos. El acceso queda bloqueado temporalmente durante 15 minutos
              details:
                retryAfterSeconds: 900
