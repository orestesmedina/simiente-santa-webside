# ============================================================================
# DOCUMENTO VIVO — Contrato OpenAPI de la API (backend/api/openapi.yaml)
#
# Versión 0.7.0: funde **aditivamente** el delta de F6 "Ministerios"
# (specs/006-ministerios/contracts/openapi.yaml, P6-18) sobre el contrato vivo
# 0.6.0, que ya había fundido la enmienda de alcance de F4 del 2026-10-12 (Q8:
# bloque «Lo que viene» de la portada, P4-18…P4-20/R4-16) y el delta de F4
# "Eventos y actividades" (P4-16). El snapshot de specs/ no se vuelve a editar;
# este es el único contrato fuente y se edita antes que el código.
#
# F6 añade 8 operaciones —dos públicas (`GET /api/v1/ministerios`, sección
# completa, y `GET /api/v1/portada/ministerios`, bloque de la portada con tope
# 5 firme en el servidor) y seis de panel bajo `/api/v1/admin/ministerios`
# (permiso `ministerios`, ya sembrado por la migración 000002: F6 **no** crea
# permisos nuevos ni amplía el catálogo de F2, que sigue en 10)—, sus esquemas y
# una garantía estructural: la **privacidad de la ficha del encargado**
# (FR-026/SC-014), que nace **oculta por defecto** (`leaderVisible: false`,
# decisión del humano del 2026-10-13). El registro de `error.code` NO crece.
#
# Aditivo: ninguna operación existente cambia de forma salvo el enum de
# `AdminActionItem.action` (crece con los 8 códigos `ministry.*` de R6-12) y la
# **prosa** de `GET /api/v1/media/{fileName}` (ahora también sirve imágenes de
# ministerios publicados, R6-7). La prosa del catálogo de permisos de F2 **no**
# cambia.
#
# Fusionado con `scripts/fusionar_f4_openapi.py` (fusión del delta de F4) y, para
# F6, con la misma fusión mecánica aditiva: el snapshot del delta trae escalares
# sin entrecomillar con ": " que se entrecomillan al fundir para que este
# documento sea YAML válido.
#
# Formato uniforme de respuestas (FR-012/FR-013, D13 del plan de F1):
#   - 2xx  → sobre de éxito: el DTO documentado de la operación
#            (objeto JSON, campos camelCase, additionalProperties: false).
#   - 4xx/5xx → sobre de error: siempre ErrorEnvelope {"error":{code,message,details?}}.
# Ninguna respuesta expone información interna (FR-013): el detalle interno se
# registra en el log estructurado con su request_id.
# ============================================================================
openapi: 3.1.0
info:
  title: API — Iglesia Simiente Santa
  version: 0.7.0
  description: |
    API REST del sitio web de la Iglesia Simiente Santa.

    En F1 expone el endpoint de estado del sistema (`/healthz`), público y sin
    autenticación. En F2 (acceso y gestión de usuarios) añade la sesión del
    panel, la gestión de cuentas y roles, la inicialización única de la puesta
    en marcha y la auditoría de solo lectura. En F3 (portada e información
    general) añade la portada pública sin autenticación (`GET /api/v1/portada`,
    solo contenido publicado y ya localizado con fallback `en → es` resuelto en
    el servidor), la descarga pública de imágenes (`GET /api/v1/media/{fileName}`)
    y la gestión del módulo desde el panel (`/api/v1/admin/portada`, permiso
    `portada`), con publicación por elemento. En F4 (eventos y actividades)
    añade la sección pública de "lo que viene" (`GET /api/v1/proximamente?lang=`,
    los próximos eventos y las próximas actividades en **dos bloques**, solo
    contenido publicado y con fecha desde hoy en adelante) y la gestión de los
    tres módulos desde el panel (`/api/v1/admin/eventos` con el permiso `eventos`,
    `/api/v1/admin/actividades` con `actividades` y el catálogo compartido
    `/api/v1/admin/categorias` con el permiso nuevo `categorias`; los tres son
    independientes entre sí). La **enmienda de alcance del 2026-10-12 (Q8)**
    añade el **bloque «Lo que viene» de la portada**: `GET
    /api/v1/portada/proximamente?lang=es|en`, un extracto de hasta **5 ítems**
    (eventos y actividades mezclados por cercanía, preferentemente de los
    próximos **2 meses** con respaldo a los siguientes próximos), solo
    publicado y próximo, con imagen y sin `detail` ni lista de fechas. En F6
    (ministerios) añade la **sección pública de ministerios**
    (`GET /api/v1/ministerios?lang=es|en`, el listado completo de publicados en
    el orden manual del módulo), su **bloque en la portada**
    (`GET /api/v1/portada/ministerios?lang=es|en`, hasta **5** ítems —tope firme
    del servidor, sin parámetro de límite—, oculto por completo sin publicados)
    y la **gestión de ministerios** desde el panel
    (`/api/v1/admin/ministerios`, permiso `ministerios` **ya existente** en el
    catálogo de F2: F6 no crea permisos nuevos y el catálogo sigue en 10), con la
    **ficha del encargado** (nombre y un único medio de contacto opcional) que
    **nace oculta por defecto** (`leaderVisible: false`, decisión del humano del
    2026-10-13) y solo se publica si el equipo enciende el interruptor.

    ## Formato uniforme de respuestas (FR-012)

    - **Éxito (2xx)**: el DTO documentado de la operación (sobre de éxito).
    - **Error (4xx/5xx)**: siempre `ErrorEnvelope` (sobre de error), también para
      los fallos previsibles (p. ej. la base de datos no conectada).

    Quien consume la API implementa el manejo de respuestas **una sola vez**:
    2xx → tipo generado de la operación; resto → `ApiError` con `ErrorEnvelope`.

    ## Códigos que la API puede devolver

    | HTTP | `error.code` | Cuándo |
    |---|---|---|
    | 200 | — | Operación exitosa (`GET /healthz` con la base de datos conectada, y el resto de operaciones con 2xx) |
    | 400 | `invalid` | Datos inválidos o incompletos, o contraseña que no cumple la política (con `details` por campo) |
    | 401 | `unauthenticated` | Sin sesión, sesión expirada/cerrada o credenciales incorrectas (mensaje genérico, FR-003) |
    | 403 | `forbidden` | Sin el permiso del módulo, cuenta desactivada al iniciar sesión, u obligación de cambiar la contraseña |
    | 404 | `not_found` | Ruta, cuenta o rol inexistente |
    | 405 | `method_not_allowed` | Método no documentado sobre una ruta existente (p. ej. `POST /healthz`) |
    | 409 | `conflict` | Correo/nombre de rol duplicado, rol en uso, inicialización ya ejecutada u operación que dejaría el panel sin administración |
    | 429 | `rate_limited` | Bloqueo por intentos fallidos (creado por el 5.º fallo; activo desde el 6.º intento) o rate-limit por IP |
    | 500 | `internal` | Error inesperado o `panic` recuperado: mensaje genérico, detalle solo en log |
    | 503 | `database_unavailable` | `GET /healthz` con la base de datos no conectada |

    El registro de `error.code` (ver `ErrorBody`) es el de toda la API: F2
    **reutiliza** los códigos de F1 (`invalid`, `unauthenticated`, `forbidden`,
    `conflict`, `rate_limited`) y el `not_found` de F1 para "cuenta/rol
    inexistente". F3 tampoco añade ninguno: reutiliza los mismos (una subida de
    imagen inválida o demasiado grande es `400 invalid` con
    `details.file`/`details.fileSize`, no un código nuevo). F4 sigue igual: no
    añade ningún `error.code` (emite `invalid`, `unauthenticated`, `forbidden`,
    `not_found`, `conflict` e `internal`; una fecha ya pasada **no** es un error:
    el elemento simplemente deja de publicarse). F6 tampoco: reutiliza los mismos
    códigos (`invalid` con `details` por campo, `unauthenticated`, `forbidden`,
    `not_found`, `conflict` —duplicado exacto— e `internal`; un **aviso** como el
    enlace de WhatsApp compartido `whatsappUrlShared` **no** es un error y no se
    bloquea).

    ## Privacidad de la ficha del encargado (F6)

    `leaderVisible` gobierna la **publicación** de la ficha entera del encargado
    (nombre **y** contacto): no borra ni edita los datos guardados (el panel los
    sigue viendo y editando). Con `leaderVisible: false` —el valor por defecto
    de un ministerio nuevo, «oculto por defecto»— la respuesta pública **no
    contiene** el nombre ni el celular/correo del encargado en ninguna forma: el
    DTO público no tiene campos para el dato oculto, las consultas públicas
    devuelven `NULL` y el bloque de la portada (`ItemMinisterioPortada`) carece
    de campos de encargado. Es una garantía del **servidor** (FR-026), no de la
    interfaz: ni la respuesta de red ni el HTML contienen el dato.

    ## Contenido vencido (F4)

    El contenido de eventos y actividades **se retira solo** de la vista pública
    al terminar su fecha (y su hora de fin, si la tiene): es un **filtro de
    lectura** del servidor ("publicado **y** próximo", regla R4-2 del plan),
    calculado con la zona horaria del lugar (`APP_TZ=America/Costa_Rica`). El
    estado del elemento **no cambia** (`publicationState` sigue `published`; el
    panel lo marca `isPast`) y la imagen de un elemento vencido **deja de
    servirse** —vuelve a servirse al cargarle una fecha próxima, sin borrar el
    archivo—. Ninguna operación pública devuelve borradores ni elementos vencidos.

    ## Seguridad

    La sesión del panel viaja en la cookie `ss_session` (`sessionCookie`): un
    token opaco cuyo SHA-256 vive en el servidor (Redis) y que caduca por
    inactividad (30 min) o por vida absoluta (1 h). Las peticiones no seguras
    con sesión exigen además la cabecera `X-CSRF-Token` con el valor de la cookie
    `csrf_token`.
  contact:
    name: Equipo del proyecto
servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo (Docker Compose)
tags:
  - name: status
    description: Estado y operación del sistema
  - name: auth
    description: Sesión del panel (inicio/cierre de sesión, sesión actual, contraseña propia)
  - name: setup
    description: Inicialización única de la puesta en marcha
  - name: users
    description: Gestión de cuentas del panel (permiso admin_usuarios_roles)
  - name: roles
    description: Gestión de roles y catálogo de permisos (permiso admin_usuarios_roles)
  - name: audit
    description: |
      Registro de accesos y de acciones administrativas (solo lectura, FR-025;
      permiso admin_usuarios_roles, FR-024)
  - name: portada
    description: Portada pública (visitante, sin autenticación; solo contenido publicado)
  - name: media
    description: Archivos de imagen publicados (logo e imagen de portada)
  - name: portada-admin
    description: Gestión de la portada desde el panel (permiso `portada` de F2)
  - name: proximamente
    description: "Lo que viene: próximos eventos y próximas actividades (visitante, sin autenticación; solo publicado y próximo)"
  - name: eventos-admin
    description: Gestión de eventos desde el panel (permiso `eventos` de F2)
  - name: actividades-admin
    description: Gestión de actividades desde el panel (permiso `actividades` de F2)
  - name: categorias-admin
    description: Catálogo de categorías (permiso nuevo `categorias`, 10.º del catálogo de F2 — research R4-4)
  - name: ministerios
    description: "Sección pública de ministerios (visitante, sin autenticación; solo publicado y sin datos ocultos del encargado)"
  - name: portada-ministerios
    description: "Bloque de ministerios de la portada (visitante; hasta 5 ítems, oculto sin publicados)"
  - name: ministerios-admin
    description: Gestión de ministerios desde el panel (permiso `ministerios` de F2)
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      tags: [status]
      operationId: getSystemStatus
      summary: Estado del sistema
      description: |
        Informa si el backend está vivo y si su conexión con la base de datos
        está establecida **en el momento de la consulta** (no es un estado
        memorizado del arranque; spec FR-003).

        - `200 OK`: el servicio está vivo y la base de datos conectada
          (sobre de éxito `SystemStatus`).
        - `503 Service Unavailable`: el servicio está vivo (sigue
          respondiendo, spec FR-004) pero la base de datos **no** está
          conectada (sobre de error `database_unavailable`, fallo previsible).

        Distinción para el cliente: si la petición falla a nivel de red
        (sin respuesta HTTP), es el backend el que no está disponible.
      security: []
      responses:
        "200":
          description: Servicio vivo y base de datos conectada.
          headers:
            Cache-Control:
              description: El estado nunca debe ser cacheado por intermediarios.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
              example:
                status: ok
                database: connected
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión en el panel
      description: |
        Autentica con correo y contraseña y emite la cookie de sesión
        (`ss_session`, `HttpOnly`) y la cookie CSRF (`csrf_token`, leída por el
        cliente para las cabeceras `X-CSRF-Token`).

        - Credenciales incorrectas **o** correo inexistente → el **mismo**
          `401` genérico y el mismo tiempo de respuesta (FR-003, SC-008).
        - Credenciales correctas con la cuenta desactivada → `403`
          (`access_disabled`), mensaje comprensible (US1 esc. 3).
        - El contador de fallos se incrementa con **cada** intento fallido: el
          **5.º fallo** responde este mismo `401` genérico y **crea el bloqueo**
          temporal de 15 minutos; desde el **6.º intento** (y durante esos 15
          minutos) la respuesta es `429 rate_limited` con `Retry-After`, con el
          **mismo** mensaje exista o no la cuenta (FR-006).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            example:
              email: ana@ejemplo.com
              password: "********"
      responses:
        "200":
          description: Sesión iniciada. Emite `Set-Cookie` de sesión y de CSRF.
          headers:
            Set-Cookie:
              description: |
                `ss_session=<token>; HttpOnly; SameSite=Lax; Path=/; Max-Age=3600`
                (vida absoluta de 1 h; `Secure` según `SESSION_COOKIE_SECURE`) +
                `csrf_token=<nonce>.<hmac>; SameSite=Lax; Path=/`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar la sesión actual
      description: |
        Termina el acceso de esta sesión (borra la sesión en el servidor y las
        cookies). Toda acción posterior exige iniciar sesión de nuevo (FR-004).
        Requiere CSRF (método no seguro con sesión).
      responses:
        "200":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: Sesión actual
      description: |
        Devuelve la identidad de la sesión iniciada con sus permisos por módulo
        (FR-015/FR-016). El cliente lo usa al cargar el panel para decidir la
        navegación (los permisos además se verifican en cada operación en el
        servidor). Sin sesión válida → `401`.
      responses:
        "200":
          description: Identidad de la sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changeMyPassword
      summary: Cambiar mi propia contraseña
      description: |
        Cambio de contraseña de la cuenta iniciada (FR-020). Exige la contraseña
        actual y una nueva que cumpla la política (FR-010): entre **8 y 64
        caracteres**, con mayúsculas, minúsculas, números y caracteres
        especiales, y **distinta de** (igualdad con comparación normalizada, no
        de contenido: puede contener esos datos) el nombre, los apellidos y el
        correo. Revoca las demás sesiones de la
        cuenta. Si la cuenta tenía `mustChangePassword`, queda resuelto (US7
        esc. 4). Requiere CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Contraseña cambiada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/setup/initialize:
    post:
      tags: [setup]
      operationId: initializeSystem
      summary: Acción de inicialización única (primer administrador)
      description: |
        Crea el rol "Administrador" (con los **10** permisos del catálogo —F4
        añadió `categorias`—) y la cuenta inicial, capaz de crear usuarios y roles
        de inmediato (FR-007, US2). El rol nace con **todo** el catálogo, que el
        servidor lee de la base de datos al inicializar.

        - Solo funciona mientras **no exista ninguna cuenta**: repetirla → `409`.
        - Exige la cabecera `X-Setup-Token` con el valor de `BOOTSTRAP_TOKEN`
          (impide el uso abusivo por un tercero en una instalación recién
          desplegada; decisión P8 del plan — puede retirarse por decisión humana).
        - Va sujeta a `rate-limit` por IP (429).
        La contraseña inicial se entrega fuera del sistema y su titular **no**
        necesita cambiarla al entrar (ya la eligió quien inicializa).
      security: []
      parameters:
        - name: X-Setup-Token
          in: header
          required: true
          description: Token de despliegue (`BOOTSTRAP_TOKEN`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeInput"
      responses:
        "201":
          description: Administrador inicial creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/usuarios:
    get:
      tags: [users]
      operationId: listUsers
      summary: Listar cuentas del panel
      description: |
        Listado paginado de cuentas con su estado, correo y rol (FR-019).
        Orden por defecto `createdAt DESC`. Defecto 20, tope 100. Requiere el
        permiso `admin_usuarios_roles`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Listado paginado de cuentas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [users]
      operationId: createUser
      summary: Crear una cuenta del equipo
      description: |
        Crea una cuenta activa con su contraseña inicial (definida por el
        administrador, FR-010) y un rol válido (FR-009). El correo se normaliza
        (trim + minúsculas): un duplicado que solo difiere en mayúsculas o
        espacios se rechaza como `409` (Q5). La contraseña debe cumplir la
        política (FR-010) y su titular deberá cambiarla al entrar (US3 esc. 6).
        Requiere permiso `admin_usuarios_roles` y CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Cuenta creada (nunca devuelve la contraseña ni su hash).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [users]
      operationId: getUser
      summary: Ver una cuenta
      description: Detalle de una cuenta (para el formulario de edición). Requiere permiso `admin_usuarios_roles`.
      responses:
        "200":
          description: Cuenta solicitada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [users]
      operationId: updateUser
      summary: Editar una cuenta (datos, rol o estado)
      description: |
        Edita los datos de la cuenta (nombre, apellidos, correo y teléfono), el
        rol asignado y/o el estado activo/inactivo (FR-011). Al asignar un rol nuevo, el nuevo **reemplaza**
        al anterior (un solo rol por cuenta, Q4). Al desactivar se bloquea el
        acceso de inmediato —también las sesiones abiertas— y se conservan los
        datos (FR-012); reactivar restaura el acceso (US5 esc. 3). Ninguna
        combinación puede dejar el panel sin una cuenta activa con permiso de
        administrar usuarios y roles: eso se responde como `409` (FR-008). Los
        duplicados por correo normalizado → `409`. Requiere CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Cuenta actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/usuarios/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: Restablecer la contraseña de una cuenta
      description: |
        El administrador define una contraseña nueva (debe cumplir la política,
        FR-010). La cuenta queda con `mustChangePassword = true`: su titular
        deberá cambiarla al entrar (US7 esc. 5) y **todas sus sesiones abiertas
        quedan revocadas** (R17). No hay recuperación por auto-servicio en el MVP.
        Requiere permiso `admin_usuarios_roles` y CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Contraseña restablecida (nunca se devuelve el valor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: Listar roles
      description: |
        Listado paginado de roles con sus permisos y cuántas cuentas los usan
        (para saber si se pueden eliminar, FR-017). Orden por defecto
        `createdAt DESC`. Defecto 20, tope 100. Requiere permiso
        `admin_usuarios_roles`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Listado paginado de roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [roles]
      operationId: createRole
      summary: Crear un rol con permisos por módulo
      description: |
        Crea un rol con nombre único y **al menos un permiso** del catálogo,
        combinados libremente (FR-014; no hay catálogo fijo de roles). El nombre
        se normaliza (trim + colapso de espacios) y su unicidad es
        insensible a mayúsculas: un duplicado "casi igual" → `409` (Q5). Un rol
        sin permisos → `400`. Requiere permiso `admin_usuarios_roles` y CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreateInput"
      responses:
        "201":
          description: Rol creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleItem"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/RoleID"
    get:
      tags: [roles]
      operationId: getRole
      summary: Ver un rol
      description: Detalle de un rol con sus permisos (para el formulario de edición). Requiere permiso `admin_usuarios_roles`.
      responses:
        "200":
          description: Rol solicitado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [roles]
      operationId: updateRole
      summary: Editar un rol (nombre y permisos)
      description: |
        Actualiza el nombre y/o los permisos del rol (FR-017, FR-018): los
        cambios se reflejan de inmediato en las cuentas que lo tienen asignado.
        Quitar todos los permisos → `400` (un rol conserva al menos uno). Un
        nombre duplicado normalizado → `409`. Si la edición dejara el panel sin
        una cuenta activa con permiso de administración → `409` (FR-008).
        Requiere CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdateInput"
      responses:
        "200":
          description: Rol actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleItem"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [roles]
      operationId: deleteRole
      summary: Eliminar un rol sin uso
      description: |
        Elimina un rol **únicamente cuando ninguna cuenta lo tiene asignado**
        (FR-017). Si hay cuentas con ese rol → `409` con el mensaje de que
        primero deben reasignarse esas cuentas. La eliminación no afecta a
        ninguna cuenta (US6 esc. 4). Requiere CSRF.
      responses:
        "200":
          description: Rol eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDeletedResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/permisos:
    get:
      tags: [roles]
      operationId: listPermissions
      summary: Catálogo de permisos por módulo
      description: |
        Lista el catálogo de permisos (los módulos del producto más la
        administración de usuarios y roles, FR-015). Es el que se usa para armar
        roles; los módulos de F5–F9 aparecen como reservados hasta que se
        construyan (F3 activó `portada` y F4 activa `eventos`, `actividades` y el
        permiso nuevo `categorias`, con el que el catálogo pasa a **10**). El
        catálogo **no** es un enum del contrato: se lee de la base de datos.
        Requiere permiso `admin_usuarios_roles`.
      responses:
        "200":
          description: Catálogo de permisos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/auditoria/accesos:
    get:
      tags: [audit]
      operationId: listAccessEvents
      summary: Historial de accesos al panel (solo lectura)
      description: |
        Historial de **intentos de inicio de sesión** —exitosos y fallidos— con
        fecha y hora, resultado e IP de origen, asociado a la cuenta cuando se
        pudo identificar (FR-022). El nombre y el correo de la cuenta que se
        muestran (`userName`, `userEmail`) se **derivan por `JOIN` con `users`**
        cuando el intento se identificó con una cuenta; no son datos guardados
        en el registro. Un intento con un correo que no corresponde a ninguna
        cuenta aparece **sin cuenta asociada** (`userId`/`userEmail`/`userName`
        en `null`): **no se guarda ni se muestra ese correo**, la interfaz indica
        "Intento sin cuenta asociada", no se crea nada y el mensaje que vio esa
        persona nunca reveló si la cuenta existía (FR-003).

        **Solo lectura** (FR-025): no existe ninguna operación de escritura sobre
        el registro; no se puede editar ni borrar por ninguna vía de la interfaz.
        Accesible **solo** con el permiso `admin_usuarios_roles` (misma decisión
        que la gestión de usuarios y roles, FR-024): sin él → `403`.

        Filtros: `userId` (cuenta) y rango de fechas `from`/`to` (FR-024).
        Paginación `platform/paginate` (§8.1.3): defecto 20, tope 100; sobre
        `{items, total, limit, offset}`; orden `createdAt DESC` (los más
        recientes primero).
      parameters:
        - $ref: "#/components/parameters/AuditUserFilter"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Historial de accesos paginado (puede venir vacío; la lista `items` es `[]`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEventList"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/admin/auditoria/acciones:
    get:
      tags: [audit]
      operationId: listAdminActions
      summary: Historial de acciones administrativas (solo lectura)
      description: |
        Historial de **acciones administrativas sensibles de gestión** (FR-023):
        quién la hizo, qué hizo, sobre qué cuenta o rol, cuándo y con qué
        resultado —incluidos los intentos que no se completan y los denegados por
        falta de permiso—. El nombre y el correo de quien la hizo (`actorName`,
        `actorEmail`) se **derivan por `JOIN` con `users`** cuando hay actor (no
        se guardan como dato duplicado); en la inicialización del sistema son
        `null`. Cubre crear, editar, activar y desactivar cuentas,
        restablecer contraseñas, crear, editar y eliminar roles, y la
        inicialización del sistema (que se registra como creación de cuenta sin
        actor). De un restablecimiento de contraseña solo queda quién lo hizo,
        sobre qué cuenta y cuándo: **nunca** la contraseña (FR-026). El cambio de
        la propia contraseña no figura aquí (no es acción administrativa).

        **Solo lectura** (FR-025), con el mismo permiso `admin_usuarios_roles`
        (FR-024): sin él → `403`.

        Filtros: `userId` (la cuenta **involucrada**: la que hizo la acción o la
        cuenta sobre la que se hizo) y rango de fechas `from`/`to` (FR-024).
        Paginación `platform/paginate` (§8.1.3): defecto 20, tope 100; sobre
        `{items, total, limit, offset}`; orden `createdAt DESC`.
      parameters:
        - $ref: "#/components/parameters/AuditUserFilter"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Historial de acciones administrativas paginado (puede venir vacío; la lista `items` es `[]`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionList"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/portada:
    get:
      tags: [portada]
      operationId: getPortada
      summary: Portada pública con la información general publicada
      description: |
        Devuelve la información general **publicada** (FR-001…FR-007) resuelta al
        idioma pedido (FR-008/FR-009): cada campo traducible usa la versión en
        inglés si existe y, si no, la versión en español (idioma base). **Nunca**
        incluye contenido en borrador (FR-013/SC-002) y **omite por completo**
        las secciones sin elementos publicados (Q10/SC-012): cuando una clave de
        sección está presente, sus arrays nunca son `null` (§8.1.2).

        Sin autenticación. `Cache-Control: no-store`. Sin paginación: es un
        documento de una sola página (las colecciones están acotadas en el
        servidor: ≤50 servicios y ≤20 canales de WhatsApp).
      security: []
      parameters:
        - name: lang
          in: query
          required: false
          description: Idioma de resolución de contenidos. Por defecto `es` (idioma base, Decisión 8).
          schema:
            type: string
            enum: [es, en]
            default: es
      responses:
        "200":
          description: Información general publicada, localizada a `lang`.
          headers:
            Cache-Control:
              description: "Siempre `no-store` (SC-003: los cambios guardados se ven en la primera carga posterior)."
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortadaPublica"
        "400":
          $ref: "#/components/responses/Invalid"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/v1/media/{fileName}:
    get:
      tags: [media]
      operationId: getMediaFile
      summary: Descarga pública de una imagen subida desde el panel
      description: |
        Sirve el archivo de imagen (logo o imagen de portada de F3, la imagen de
        un evento o una actividad de F4, o la imagen de un ministerio de F6) cuyo
        nombre generó el servidor en la
        subida (`img_<uuid>.<ext>`, research R3-8). **Política de publicación
        (FR-013/SC-002, analyze C4; R4-6 de F4 y R6-7 de F6)**: solo se sirven
        archivos **referenciados por contenido publicado y visible hoy** — la
        identidad `published` de la portada, un evento/actividad `published`
        **con una fecha próxima** (la misma regla del servidor que
        `GET /api/v1/proximamente`, R4-2), o un ministerio `published` (F6: el
        ministerio en borrador **no** sirve su imagen; el archivo no se borra y
        la misma URL vuelve a responder `200` al publicarlo) —. Un archivo que no
        esté referenciado
        por contenido publicado y próximo (elemento retirado a borrador, elemento
        cuya fecha ya pasó, subida huérfana o inexistente) responde `404
        not_found`, y el nombre que no cumple el patrón responde `400 invalid`
        (analyze M6).

        La imagen de un elemento **vencido** deja de servirse sin borrar el
        archivo (decisión firme de la puerta 2 de F4): al cargarle una fecha
        próxima, la misma URL vuelve a responder `200`.

        El nombre se valida con regex antes de tocar el disco (sin *path
        traversal*); la respuesta lleva `X-Content-Type-Options: nosniff`,
        `Content-Disposition: inline` y **`Cache-Control: no-store`** (trade-off
        de RG3-8: al depender la descarga del estado de publicación, una caché
        `immutable` volvería a mostrar imágenes de elementos ya retirados). Sin
        autenticación: la descarga es pública, pero limitada a lo publicado.
      security: []
      parameters:
        - name: fileName
          in: path
          required: true
          description: Nombre del archivo tal como lo devolvió la subida (`fileName` de `ImageUploadResult`).
          schema:
            type: string
            pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
      responses:
        "200":
          description: Binario de imagen (JPEG, PNG o WebP según la firma detectada en la subida).
          headers:
            Cache-Control:
              description: Siempre `no-store` (la descarga depende del estado de publicación, RG3-8).
              schema:
                type: string
                enum: [no-store]
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada:
    get:
      tags: [portada-admin]
      operationId: getPortadaAdmin
      summary: Estado completo de la portada para el panel (incluye borradores)
      description: |
        Devuelve **todo** el contenido del módulo —identidad, «quiénes somos»,
        contacto, horario, canales de WhatsApp y redes— en **ambos idiomas** y
        con su `publicationState` por elemento (FR-011, US3 esc. 7), incluidos los
        borradores (este es el único lado que los ve; exige el permiso `portada`).
        Los singletons (identidad, quiénes somos, contacto) son `null` hasta el
        primer guardado. Cada colección va en su sobre `{items}` (§8.1.2) acotado
        en el servidor (≤50 servicios, ≤20 canales; redes: 1 por red del catálogo).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Estado completo del módulo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortadaAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/v1/admin/portada/identidad:
    put:
      tags: [portada-admin]
      operationId: updateIdentity
      summary: Guarda la identidad de la iglesia (crea o reemplaza el singleton)
      description: |
        Reemplazo completo de la identidad (FR-002/FR-011): nombre oficial,
        lema/misión/visión, logo e imagen de portada con sus textos alternativos
        (FR-019) — versión en español obligatoria y en inglés opcional (FR-008).
        `logoFile`/`coverImageFile` referencian archivos ya subidos con
        `POST /api/v1/admin/portada/imagenes`; un `null` explícito quita la imagen.
        `publicationState` controla la visibilidad del elemento (FR-013); si el
        elemento ya estaba publicado, los cambios guardados son visibles de
        inmediato (FR-014). Auditoría *(analyze M5)*: un cambio de datos registra
        `home.identity.update`; un cambio solo de estado registra
        `home.publish`/`home.unpublish`; un cambio que modifica **datos y estado**
        deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityInput"
      responses:
        "200":
          description: Identidad guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/quienes-somos:
    put:
      tags: [portada-admin]
      operationId: updateAbout
      summary: Guarda el texto de «quiénes somos» (crea o reemplaza el singleton)
      description: |
        Texto **plano** con límite de 1.000 caracteres por idioma (FR-003):
        `textEs` obligatorio, `textEn` opcional (FR-008). Se guarda íntegro, sin
        interpretar (constitución §IV). Auditoría *(analyze M5)*: un cambio de datos
        registra `home.about.update`; un cambio solo de estado registra
        `home.publish`/`home.unpublish`; un cambio que modifica **datos y estado**
        deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutInput"
      responses:
        "200":
          description: Texto guardado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/contacto:
    put:
      tags: [portada-admin]
      operationId: updateContact
      summary: Guarda los datos de contacto (crea o reemplaza el singleton)
      description: |
        Dirección física (es obligatoria, en opcional), correo electrónico y
        teléfono (FR-007), todos obligatorios salvo la traducción (FR-015):
        correo con formato de correo y teléfono con el criterio de F2. Auditoría
        *(analyze M5)*: un cambio de datos registra `home.contact.update`; un cambio
        solo de estado registra `home.publish`/`home.unpublish`; un cambio que
        modifica **datos y estado** deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "200":
          description: Datos de contacto guardados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/horario:
    post:
      tags: [portada-admin]
      operationId: createScheduleItem
      summary: Crea un servicio del horario
      description: |
        Un servicio tiene día (0=domingo…6=sábado, **selector localizado por i18n,
        nunca texto libre**), inicio "HH:MM" (24 h) y **fin opcional** `endTime`
        ("HH:MM", posterior al inicio) para rangos tipo «10:00 a. m. − 12:00 m.»;
        nombre/descripción y lugar son traducibles (FR-004/Q3): nombre y lugar en
        español son obligatorios, todo lo demás traducible es opcional (FR-008).
        Nace en `draft` salvo que se envíe `publicationState: published`. Máximo 50
        servicios (constante del servidor). Auditoría *(analyze M5)*: el alta
        registra **siempre** `home.schedule.create`, aunque nazca publicada
        (`home.publish`/`home.unpublish` solo registran cambios de estado, FR-017).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "201":
          description: Servicio creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItemAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/horario/{id}:
    patch:
      tags: [portada-admin]
      operationId: updateScheduleItem
      summary: Edita un servicio del horario (y/o lo publica o retira)
      description: |
        Actualiza los campos presentes (al menos uno). `publicationState` publica
        o retira **este** elemento por separado (FR-013). Sobre un elemento ya
        publicado, los cambios guardados son visibles de inmediato (FR-014).
        Auditoría *(analyze M5)*: un cambio de datos registra `home.schedule.update`;
        un cambio solo de estado registra `home.publish`/`home.unpublish`; un cambio
        que modifica **datos y estado** deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemPatch"
      responses:
