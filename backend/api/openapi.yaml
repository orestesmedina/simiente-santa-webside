        Catálogo fijo (FR-006/Q5): `facebook`, `instagram`, `youtube`, `tiktok` o
        `spotify`, con **un solo enlace por red**. Una red fuera del catálogo se
        rechaza (`400`, `details.network`) y un segundo enlace para la misma red
