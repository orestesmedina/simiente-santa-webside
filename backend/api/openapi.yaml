        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/redes/{id}:
    patch:
      tags: [portada-admin]
      operationId: updateSocialLink
      summary: Edita el enlace de una red social (y/o lo publica o retira)
      description: |
        Igual que `updateScheduleItem` para un enlace de red (FR-006/FR-013/FR-014).
        Auditoría *(analyze M5)*: un cambio de datos registra `home.social.update`;
        un cambio solo de estado registra `home.publish`/`home.unpublish`; un cambio
        que modifica **datos y estado** deja **ambas** filas (FR-017).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkPatch"
      responses:
        "200":
          description: Enlace guardado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLinkAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [portada-admin]
      operationId: deleteSocialLink
      summary: Elimina el enlace de una red social
      description: "Borrado físico. Auditoría: `home.social.delete` (FR-017)."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PortadaItemId"
      responses:
        "204":
          description: Enlace eliminado (sin cuerpo).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/admin/portada/imagenes:
    post:
      tags: [portada-admin]
      operationId: uploadPortadaImage
      summary: Sube el logotipo o la imagen de portada
      description: |
        Recibe `multipart/form-data` con el campo `file`. El servidor **genera el
        nombre** (`img_<uuid>.<ext>`), detecta el tipo por **firma binaria** y solo
        admite `image/jpeg`, `image/png` e `image/webp` (sin SVG ni GIF: research
        R3-8), con tope de 8 MB (`UPLOAD_MAX_BYTES`). El resultado se referencia
        desde `PUT /api/v1/admin/portada/identidad` (`logoFile`/`coverImageFile`).
        La subida **no** cambia contenido visible: no aparece en la portada hasta
        que la identidad que la referencia se guarda publicada. Auditoría
        *(analyze I8)*: cada subida deja su fila **`home.image.upload`**
        (`targetLabel` = `Portada · Imagen · <fileName>`) en la misma operación
        (fail-closed: si el registro falla, se aborta la subida y se elimina el
        archivo); la referencia a la identidad se registra aparte con
        `home.identity.update` al guardar. Los archivos huérfanos (subidas sin
        referencia) se eliminan con el reemplazo/borrado best-effort del servicio.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo de imagen (JPEG/PNG/WebP, ≤8 MB).
              additionalProperties: false
      responses:
        "201":
          description: Archivo almacenado; `url` es relativa al origen de la API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ss_session
      description: |
        Sesión en servidor **en Redis** (D-A7 confirmada el 2026-10-04): cookie
        `ss_session` `HttpOnly` con un token opaco cuyo **SHA-256** es la clave
        en Redis (el token en claro nunca se guarda). Caduca por inactividad
        (30 min) o por vida absoluta (1 h desde el inicio de sesión); su
        `Max-Age` es la vida absoluta. Se emite en `POST /api/v1/auth/login` y se
        borra en logout y en toda revocación. Las peticiones no seguras con
        sesión exigen además la cabecera `X-CSRF-Token` con el valor de la
        cookie `csrf_token`.

  parameters:
    Limit:
      name: limit
      in: query
      description: Tamaño de página (por defecto 20, tope 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Filas a saltar (por defecto 0).
      schema:
        type: integer
        minimum: 0
        default: 0
    UserID:
      name: id
      in: path
      required: true
      description: Identificador (UUID) de la cuenta.
      schema:
        type: string
        format: uuid
    RoleID:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del rol.
      schema:
        type: string
        format: uuid
    AuditUserFilter:
      name: userId
      in: query
      description: |
        Filtra por cuenta (FR-024). En `/admin/auditoria/accesos`, la cuenta que
        intentó el acceso; en `/admin/auditoria/acciones`, la cuenta involucrada
        (la que hizo la acción **o** la cuenta sobre la que se hizo). Los
        registros que **no** tienen ninguna cuenta asociada (hoy: los intentos de
        acceso contra un correo inexistente) solo aparecen cuando **no** se envía
        este filtro. La **inicialización del sistema sí tiene cuenta asociada**
        —su cuenta objetivo (`target_user_id`)—, de modo que aparece al filtrar
        por esa cuenta.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      description: |
        Inicio del rango de fechas (**incluido**), ISO-8601 en UTC (FR-024). Si se
        envía `to` y `from` es posterior → `400 invalid`.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: |
        Fin del rango de fechas (**excluido**), ISO-8601 en UTC: el semirango es
        `[from, to)` (FR-024). Para incluir un día entero, `to` es el inicio del
        día siguiente.
      schema:
        type: string
        format: date-time
    PortadaItemId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del elemento de la portada.
      schema:
        type: string
        format: uuid

  schemas:
    SystemStatus:
      type: object
      description: |
        Sobre de éxito del endpoint de estado: informe del sistema en el
        momento de la consulta. F1 lo emite únicamente como `200`; si algo
        está degradado, la respuesta es un error con su sobre (p. ej. `503`
        `database_unavailable`), de modo que todo cliente maneja un solo
        formato de error (FR-012).
      required: [status, database]
      properties:
        status:
          type: string
          const: ok
          description: |
            Estado del proceso backend. En F1 el único valor posible es `ok`
            (un `200` siempre significa "servicio sano"). El campo se mantiene
            por FR-002 (la respuesta indica el estado del servicio) y admite
            valores futuros si se agregan más chequeos.
        database:
          type: string
          const: connected
          description: |
            Conexión con PostgreSQL establecida en el momento de la consulta
            (FR-003). El caso "no conectada" se comunica como `503` con
            `error.code = database_unavailable` y
            `error.details.database = "disconnected"`.
      additionalProperties: false
    ErrorEnvelope:
      type: object
      description: |
        Sobre de error estándar de la API (FR-012/FR-013). Todo 4xx/5xx lo
        usa; es el único formato de error que quien consume debe implementar.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      additionalProperties: false
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estable y accionable de la API (snake_case). Registro cerrado;
            F1 puede emitir: `not_found`, `method_not_allowed`,
            `database_unavailable`, `internal`.
          enum:
            - invalid
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - rate_limited
            - database_unavailable
            - internal
        message:
          type: string
          description: |
            Mensaje seguro y comprensible (español). Nunca contiene nombres
            internos, trazas de error, SQL ni datos de infraestructura (FR-013).
            Para `internal` es siempre el genérico "Error interno del servidor".
          example: La base de datos no está conectada
        details:
          type: object
          description: |
            Detalle opcional y seguro: por campo en validaciones (F2+) o datos
            de diagnóstico del caso (p. ej. `{"database":"disconnected"}`).
            Nunca información interna del sistema.
          additionalProperties: true
      additionalProperties: false

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Correo de la cuenta (se normaliza con trim + minúsculas).
        password:
          type: string
          format: password
          maxLength: 64
          description: Contraseña en texto plano (solo viaja aquí; nunca se devuelve ni se guarda).
      additionalProperties: false
    SessionUser:
      type: object
      description: |
        Identidad de la sesión iniciada con sus permisos efectivos (los del rol
        asignado; nunca la suma de varios roles, Q4). No contiene ningún dato
        sensible de credenciales (FR-003).
      required: [id, email, firstName, lastName, phone, roleId, roleName, permissions, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          description: Nombre de la persona (datos de la cuenta confirmados el 2026-10-04).
        lastName:
          type: string
          description: Apellidos de la persona.
        phone:
          type: string
          description: Número de teléfono (formato telefónico razonable, FR-009).
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        permissions:
          type: array
          description: Códigos de permiso del catálogo (p. ej. `eventos`, `admin_usuarios_roles`).
          items:
            type: string
        mustChangePassword:
          type: boolean
          description: Si es `true`, la cuenta debe cambiar su contraseña antes de usar el panel (US7 esc. 4).
      additionalProperties: false
    LogoutResponse:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          const: true
      additionalProperties: false
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 64
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: |
            Política FR-010: entre 8 y 64 caracteres, con mayúsculas,
            minúsculas, números y caracteres especiales, y **distinta de** (no
            de contenido: se rechaza que sea **igual**, con comparación
            normalizada) el nombre, los apellidos y el correo.
      additionalProperties: false
    PasswordChangedResponse:
      type: object
      required: [passwordChanged]
      properties:
        passwordChanged:
          type: boolean
          const: true
      additionalProperties: false
    InitializeInput:
      type: object
      description: |
        Datos de la cuenta del primer administrador: los mismos campos
        obligatorios de toda cuenta (nombre, apellidos, correo y teléfono;
        confirmados el 2026-10-04) y su contraseña.
      required: [firstName, lastName, email, phone, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
          description: Formato telefónico razonable (FR-009), con dígitos, separadores habituales, prefijo internacional opcional y al menos 7 dígitos.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Contraseña del administrador inicial (misma política FR-010; no exige cambio al entrar).
      additionalProperties: false
    CreateUserInput:
      type: object
      required: [firstName, lastName, email, phone, roleId, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre de la persona (campo obligatorio y separado de los apellidos; FR-009).
        lastName:
          type: string
          minLength: 1
          maxLength: 120
          description: Apellidos de la persona (campo obligatorio; FR-009).
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
          description: |
            Número de teléfono obligatorio (FR-009): dígitos con espacios,
            guiones o paréntesis como separadores habituales, un prefijo
            internacional opcional y al menos 7 dígitos. Un formato que no es
            telefónico → `400` con `details.phone`.
        roleId:
          type: string
          format: uuid
          description: Rol existente (uno solo por cuenta, Q4). Un rol inexistente → `400` con `details.roleId`.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Contraseña inicial definida por el administrador (FR-010); su titular debe cambiarla al entrar.
      additionalProperties: false
    UpdateUserInput:
      type: object
      description: |
        Al menos un campo (nombre, apellidos, correo, teléfono, rol o estado;
        mismas validaciones que al crear, FR-011). El nuevo rol reemplaza al
        anterior (Q4). `isActive: false` bloquea el acceso de inmediato y
        revoca las sesiones abiertas (FR-012); nunca se eliminan cuentas
        (FR-013).
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        roleId:
          type: string
          format: uuid
        isActive:
          type: boolean
      minProperties: 1
      additionalProperties: false
    ResetPasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Contraseña nueva definida por el administrador (FR-010).
      additionalProperties: false
    PasswordResetResponse:
      type: object
      required: [passwordReset]
      properties:
        passwordReset:
          type: boolean
          const: true
      additionalProperties: false
    UserItem:
      type: object
      description: |
        Cuenta del panel en listados y detalle (FR-019). Incluye la fecha y el
        origen de su último acceso exitoso (FR-021). Nunca incluye credenciales.
      required: [id, email, firstName, lastName, phone, roleId, roleName, isActive, mustChangePassword, lastLoginAt, lastLoginIp, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          description: Nombre de la persona.
        lastName:
          type: string
          description: Apellidos de la persona.
        phone:
          type: string
          description: Número de teléfono (FR-009).
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        isActive:
          type: boolean
          description: "Cuando es `false`, el acceso queda retirado (desactivada); los datos se conservan siempre (FR-012/FR-013)."
        mustChangePassword:
          type: boolean
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          description: |
            Fecha y hora del último acceso **exitoso** al panel (FR-021). `null`
            si la cuenta aún no ha iniciado sesión: la ficha lo indica sin
            mostrar ningún acceso inventado (US8 esc. 6). Solo lo escribe el
            login exitoso; no es editable.
        lastLoginIp:
          type: [string, "null"]
          description: |
            Origen (IP) del último acceso exitoso (FR-021). `null` si aún no hay
            accesos. Solo lo escribe el login exitoso; no es editable.
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    UserList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserItem"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    RoleCreateInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre único (se normaliza con trim + colapso de espacios; unicidad sin distinguir mayúsculas).
        permissions:
          type: array
          minItems: 1
          description: Al menos un permiso del catálogo (FR-014); códigos repetidos se descartan.
          items:
            type: string
      additionalProperties: false
    RoleUpdateInput:
      type: object
      description: Al menos un campo. Si se envía `permissions`, debe traer al menos un permiso (FR-014).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        permissions:
          type: array
          minItems: 1
          items:
            type: string
      minProperties: 1
      additionalProperties: false
    RoleItem:
      type: object
      required: [id, name, permissions, userCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: array
          description: Códigos de permiso del rol (los efectivos de sus cuentas, Q4).
          items:
            type: string
        userCount:
          type: integer
          description: Cuentas con este rol (0 = se puede eliminar, FR-017).
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    RoleList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleItem"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    RoleDeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          const: true
      additionalProperties: false
    PermissionItem:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          description: Código estable del módulo (p. ej. `eventos`, `admin_usuarios_roles`).
        label:
          type: string
          description: Etiqueta para la interfaz en español.
      additionalProperties: false
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionItem"
      additionalProperties: false
    AccessEventItem:
      type: object
      description: |
        Registro de un intento de inicio de sesión (FR-022). **Solo lectura**
        (FR-025) y sin credenciales (FR-026): de un inicio de sesión solo queda
        su resultado, nunca la contraseña probada.
      required: [id, userId, userEmail, userName, result, ip, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: [string, "null"]
          format: uuid
          description: |
            Cuenta asociada cuando se pudo identificar (FR-022). `null` cuando el
            correo no corresponde a ninguna cuenta: el intento queda registrado
            igual, sin asociación y sin crear nada (FR-003, US8 esc. 7).
        userEmail:
          type: [string, "null"]
          format: email
          description: |
            Correo de la cuenta asociada, **derivado por `JOIN` con `users`**
            (valor actual de `users.email`; no se guarda como dato duplicado en
            el registro). `null` si el intento no se asoció a ninguna cuenta: en
            ese caso **no se guarda ni se muestra ningún correo** (ni siquiera el
            probado) y la interfaz indica "Intento sin cuenta asociada".
        userName:
          type: [string, "null"]
          description: |
            Nombre de la cuenta asociada (`firstName lastName`), **derivado por
            `JOIN` con `users`** cuando el intento se identificó con una cuenta
            (FR-022); no es un dato guardado en el registro. `null` cuando el
            intento quedó sin cuenta asociada: la interfaz muestra entonces
            "Intento sin cuenta asociada", sin mostrar ningún correo.
        result:
          type: string
          enum: [success, failure]
          description: |
            `success` = acceso completado; `failure` = intento fallido (incluye
            los de cuentas inactivas y los que ocurren durante un bloqueo
            temporal de FR-006).
        ip:
          type: string
          minLength: 3
          maxLength: 45
          description: IP de origen del intento (sin puerto).
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora del intento (ISO-8601 en UTC).
      additionalProperties: false
    AccessEventList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: Registros de la página (nunca `null`; vacío es `[]`).
          items:
            $ref: "#/components/schemas/AccessEventItem"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    AdminActionItem:
      type: object
      description: |
        Registro de una acción administrativa sensible (FR-023): quién la hizo,
        qué hizo, sobre qué cuenta o rol, cuándo y con qué resultado —incluidos
        los intentos que no se completan y los denegados por falta de permiso—.
        **Solo lectura** (FR-025) y sin credenciales (FR-026): de un
        restablecimiento de contraseña solo queda quién lo hizo, sobre qué cuenta
        y cuándo.
      required: [id, actorId, actorEmail, actorName, action, targetKind, targetId, targetLabel, result, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: [string, "null"]
          format: uuid
          description: |
            Cuenta que hizo la acción. `null` **solo** en la inicialización del
            sistema (FR-007), cuando todavía no existía ninguna cuenta.
        actorEmail:
          type: [string, "null"]
          format: email
          description: |
            Correo de quien hizo la acción, **derivado por `JOIN` con `users`**
            (valor actual de `users.email`; no se guarda como dato duplicado en
            el registro). `null` en la inicialización del sistema (sin actor).
        actorName:
          type: [string, "null"]
          description: |
            Nombre de quien hizo la acción (`firstName lastName`), **derivado por
            `JOIN` con `users`** cuando hay actor (FR-023); no es un dato
            guardado en el registro. `null` en la inicialización del sistema.
        action:
          type: string
          enum:
            - user.create
            - user.update
            - user.activate
            - user.deactivate
            - user.password_reset
            - role.create
            - role.update
            - role.delete
            - home.identity.update
            - home.about.update
            - home.contact.update
            - home.schedule.create
            - home.schedule.update
            - home.schedule.delete
            - home.whatsapp.create
            - home.whatsapp.update
            - home.whatsapp.delete
            - home.social.create
            - home.social.update
            - home.social.delete
            - home.image.upload
            - home.publish
            - home.unpublish
          description: |
            Qué se hizo (FR-023). La inicialización del administrador inicial
            (FR-007) se registra como `user.create` sin actor: cuenta como
            creación de cuenta. El cambio de la propia contraseña (FR-020) **no**
            aparece aquí.

            F3 (FR-017) añade los 15 códigos `home.*` de la portada, con la regla
            exacta de `analyze` M5: el alta usa `home.*.create` aunque el elemento
            nazca publicado; `home.publish`/`home.unpublish` registran **solo**
            cambios de estado (una edición que cambia datos y estado deja dos
            filas); la subida de una imagen se audita con `home.image.upload`
            (`analyze` I8).
        targetKind:
          type: string
          enum: [user, role, content]
          description: |
            Sobre qué se hizo: una cuenta (`user`), un rol (`role`) o un elemento
            de contenido de la portada (`content`, F3). Para `content`,
            `targetId` es `null` (los elementos de la portada no tienen FK en
            `admin_actions`) y `targetLabel` identifica el elemento
            (`Portada · <Sección> · <nombre>`).
        targetId:
          type: [string, "null"]
          format: uuid
          description: |
            Cuenta o rol sobre el que se hizo. `null` cuando no llegó a existir
            (p. ej. una creación rechazada por duplicado) o cuando el rol ya fue
            eliminado (FR-017): el registro se conserva igualmente (FR-025) y su
            `targetLabel` sigue diciendo sobre qué fue. En las acciones con
            `targetKind: content` (F3) es siempre `null`: el elemento de la
            portada se identifica por su `targetLabel`.
        targetLabel:
          type: [string, "null"]
          description: |
            Etiqueta del objetivo en el momento de la acción (correo de la cuenta,
            nombre del rol o, en F3, `Portada · <Sección> · <nombre del
            elemento>`). Se conserva aunque después se edite o elimine.
        result:
          type: string
          enum: [success, failure, denied]
          description: |
            `success` = completada; `failure` = intento que no se completó (datos
            inválidos, duplicado, regla anti-bloqueo…); `denied` = denegada por
            falta de permiso (FR-016).
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de la acción (ISO-8601 en UTC).
      additionalProperties: false
    AdminActionList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: Registros de la página (nunca `null`; vacío es `[]`).
          items:
            $ref: "#/components/schemas/AdminActionItem"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    PublicationState:
      type: string
      enum: [draft, published]
      description: |
        Estado de publicación **por elemento** (FR-013, Decisión 4): `draft` no es
        visible para el visitante; `published` sí. Se publica al guardar (FR-014).

    # ---------------------------------------------------------------- público
    PortadaPublica:
      type: object
      required: [lang]
      description: |
        Información general publicada, resuelta a `lang` (fallback `en → es` por
        campo, FR-009). Las claves de sección están presentes **solo** si tienen
        elementos publicados (Q10/SC-012); si están presentes, sus arrays nunca
        son `null`. `identity`, `about` y `contact` son objetos únicos (FR-002,
        FR-003, FR-007).
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        identity:
          $ref: "#/components/schemas/IdentityPublic"
        about:
          $ref: "#/components/schemas/AboutPublic"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleItemPublic"
        whatsapp:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappChannelPublic"
        socials:
          type: array
          items:
            $ref: "#/components/schemas/SocialLinkPublic"
        contact:
          $ref: "#/components/schemas/ContactPublic"
      additionalProperties: false

    IdentityPublic:
      type: object
      required: [name]
      description: Identidad publicada (FR-002), ya localizada a `lang`.
      properties:
        name:
          type: string
          maxLength: 160
          description: Nombre oficial de la iglesia.
        tagline:
          type: string
          maxLength: 300
        mission:
          type: string
          maxLength: 600
        vision:
          type: string
          maxLength: 600
        logoUrl:
          type: string
          description: URL relativa al origen de la API (`/api/v1/media/<file>`).
        logoAlt:
          type: string
          maxLength: 300
          description: Texto alternativo del logotipo (FR-019).
        coverImageUrl:
          type: string
          description: URL relativa al origen de la API (`/api/v1/media/<file>`).
        coverImageAlt:
          type: string
          maxLength: 300
      additionalProperties: false

    AboutPublic:
      type: object
      required: [text]
      description: «Quiénes somos» publicado (FR-003), texto plano ya localizado.
      properties:
        text:
          type: string
          maxLength: 1000
      additionalProperties: false

    ScheduleItemPublic:
      type: object
      required: [id, dayOfWeek, startTime, name, place]
      description: Servicio del horario publicado (FR-004), ya localizado.
      properties:
        id:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo … 6 = sábado. El nombre del día lo localiza el cliente.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Hora de inicio ("HH:MM", 24 h).
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", 24 h; posterior a `startTime`) para
            rangos tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        name:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 400
        place:
          type: string
          maxLength: 200
      additionalProperties: false

    WhatsappChannelPublic:
      type: object
      required: [id, name, kind, url]
      description: |
        Canal de WhatsApp publicado (FR-005), ya localizado. `url` es el enlace
        listo para abrir el canal: `https://wa.me/<dígitos>` para `direct`, o la
        URL del grupo para `group` (SC-009: se abre con un clic o toque).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
          description: Nombre/propósito del canal.
        kind:
          type: string
          enum: [direct, group]
        url:
          type: string
          format: uri
      additionalProperties: false

    SocialLinkPublic:
      type: object
      required: [id, network, url]
      description: Red social publicada (FR-006), un enlace por red del catálogo.
      properties:
        id:
          type: string
          format: uuid
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
      additionalProperties: false

    ContactPublic:
      type: object
      required: [address, email, phone]
      description: Datos de contacto publicados (FR-007), ya localizados.
      properties:
        address:
          type: string
          maxLength: 300
        email:
          type: string
          format: email
        phone:
          type: string
      additionalProperties: false

    # ------------------------------------------------------------------ panel
    PortadaAdmin:
      type: object
      required: [identity, about, contact, schedule, whatsapp, socials]
      description: |
        Estado completo del módulo (FR-011), en **ambos idiomas** y con
        `publicationState` por elemento. Los singletons son `null` hasta el primer
        guardado. Cada colección va en su sobre `{items}` (§8.1.2).
      properties:
        identity:
          oneOf:
            - $ref: "#/components/schemas/IdentityAdmin"
            - type: "null"
        about:
          oneOf:
            - $ref: "#/components/schemas/AboutAdmin"
            - type: "null"
        contact:
          oneOf:
            - $ref: "#/components/schemas/ContactAdmin"
            - type: "null"
        schedule:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ScheduleItemAdmin"
          additionalProperties: false
        whatsapp:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WhatsappChannelAdmin"
          additionalProperties: false
        socials:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SocialLinkAdmin"
          additionalProperties: false
      additionalProperties: false

    IdentityAdmin:
      type: object
      required: [nameEs, publicationState, createdAt, updatedAt]
      description: Identidad con sus dos idiomas (es obligatorio, en opcional, FR-008).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        taglineEs:
          type: [string, "null"]
          maxLength: 300
        taglineEn:
          type: [string, "null"]
          maxLength: 300
        missionEs:
          type: [string, "null"]
          maxLength: 600
        missionEn:
          type: [string, "null"]
          maxLength: 600
        visionEs:
          type: [string, "null"]
          maxLength: 600
        visionEn:
          type: [string, "null"]
          maxLength: 600
        logoFile:
          type: [string, "null"]
          description: Nombre del archivo del logotipo (`img_<uuid>.<ext>`).
        logoAltEs:
          type: [string, "null"]
          maxLength: 300
        logoAltEn:
          type: [string, "null"]
          maxLength: 300
        coverImageFile:
          type: [string, "null"]
        coverImageAltEs:
          type: [string, "null"]
          maxLength: 300
        coverImageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    IdentityInput:
      type: object
      required: [nameEs, publicationState]
      description: |
        Reemplazo completo (PUT). `nameEs` obligatorio (FR-015); el resto, con
        traducción en inglés opcional (FR-008). Todo campo `*En` acepta `""`/solo
        espacios y se guarda como `null` (analyze I6). `logoFile`/`coverImageFile`
        referencian archivos ya subidos; si hay imagen, `logoAltEs`/
        `coverImageAltEs` son obligatorios (FR-019). `null` explícito quita la
        imagen correspondiente.
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        taglineEs:
          type: [string, "null"]
          maxLength: 300
        taglineEn:
          type: [string, "null"]
          maxLength: 300
        missionEs:
          type: [string, "null"]
          maxLength: 600
        missionEn:
          type: [string, "null"]
          maxLength: 600
        visionEs:
          type: [string, "null"]
          maxLength: 600
        visionEn:
          type: [string, "null"]
          maxLength: 600
        logoFile:
          type: [string, "null"]
          maxLength: 120
        logoAltEs:
          type: [string, "null"]
          maxLength: 300
        logoAltEn:
          type: [string, "null"]
          maxLength: 300
        coverImageFile:
          type: [string, "null"]
          maxLength: 120
        coverImageAltEs:
          type: [string, "null"]
          maxLength: 300
        coverImageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    AboutAdmin:
      type: object
      required: [textEs, publicationState, createdAt, updatedAt]
      properties:
        textEs:
          type: string
          minLength: 1
          maxLength: 1000
        textEn:
          type: [string, "null"]
          maxLength: 1000
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    AboutInput:
      type: object
      required: [textEs, publicationState]
      description: Texto plano (FR-003); `textEs` obligatorio y ≤1.000 caracteres (FR-015). `textEn` acepta `""`/espacios y se guarda como `null` (analyze I6).
      properties:
        textEs:
          type: string
          minLength: 1
          maxLength: 1000
        textEn:
          type: [string, "null"]
          maxLength: 1000
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    ContactAdmin:
      type: object
      required: [addressEs, email, phone, publicationState, createdAt, updatedAt]
      properties:
        addressEs:
          type: string
          minLength: 1
          maxLength: 300
        addressEn:
          type: [string, "null"]
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          description: Formato telefónico de F2 (dígitos, separadores habituales, `+` opcional, ≥7 dígitos).
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    ContactInput:
      type: object
      required: [addressEs, email, phone, publicationState]
      description: Dirección, correo y teléfono son obligatorios (FR-015); `addressEn` opcional (`""`/espacios → `null`, analyze I6).
      properties:
        addressEs:
          type: string
          minLength: 1
          maxLength: 300
        addressEn:
          type: [string, "null"]
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    ScheduleItemAdmin:
      type: object
      required: [id, dayOfWeek, startTime, nameEs, placeEs, publicationState, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", posterior a `startTime`) para rangos
            tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: [string, "null"]
          maxLength: 400
        descriptionEn:
          type: [string, "null"]
          maxLength: 400
        placeEs:
          type: string
          minLength: 1
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
          description: Orden de presentación (por defecto 0; se muestra por `sortOrder, id`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    ScheduleItemInput:
      type: object
      required: [dayOfWeek, startTime, nameEs, placeEs]
      description: |
        Alta de un servicio (FR-004/FR-015): día (0–6, selector localizado, nunca
        texto libre), inicio y nombre/lugar en español obligatorios; **`endTime`
        (fin "HH:MM") es opcional** para rangos (analyze C2), al igual que la
        descripción y las traducciones al inglés (`""`/espacios → `null`, analyze
        I6). Sin `id` (lo genera el servidor) ni `createdAt`/`updatedAt`.
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", posterior a `startTime`) para rangos
            tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: [string, "null"]
          maxLength: 400
        descriptionEn:
          type: [string, "null"]
          maxLength: 400
        placeEs:
          type: string
          minLength: 1
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    ScheduleItemPatch:
      type: object
      minProperties: 1
      description: |
        Edición parcial de un servicio: se actualizan los campos presentes (al
        menos uno). Un campo `*En` con `null` o `""`/espacios vacía su traducción
        al inglés (analyze I6); `endTime: null` quita la hora de fin.
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            Hora de fin opcional ("HH:MM", posterior a `startTime`) para rangos
            tipo «10:00 a. m. − 12:00 m.» (analyze C2). `null` = sin hora de fin.
        nameEs:
          type: string
          minLength: 1
          maxLength: 160
        nameEn:
          type: [string, "null"]
          maxLength: 160
        descriptionEs:
          type: [string, "null"]
          maxLength: 400
        descriptionEn:
          type: [string, "null"]
          maxLength: 400
        placeEs:
          type: string
          minLength: 1
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    WhatsappChannelAdmin:
      type: object
      required: [id, nameEs, kind, destination, publicationState, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        kind:
          type: string
          enum: [direct, group]
        destination:
          type: string
          maxLength: 320
          description: |
            Destino único del canal (FR-005): teléfono normalizado (`direct`) o
            URL del grupo (`group`).
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    WhatsappChannelInput:
      type: object
      required: [nameEs, kind, destination]
      description: |
        Alta de un canal (FR-005/FR-015). `kind=direct` exige teléfono con
        formato válido; `kind=group` exige URL `https` de `chat.whatsapp.com` o
        `wa.me`. El duplicado exacto (kind + destino + nombre normalizados) → 409.
        `nameEn` acepta `""`/espacios y se guarda como `null` (analyze I6).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        kind:
          type: string
          enum: [direct, group]
        destination:
          type: string
          minLength: 1
          maxLength: 320
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    WhatsappChannelPatch:
      type: object
      minProperties: 1
      description: Edición parcial de un canal (al menos un campo presente). `nameEn` acepta `""`/espacios y se guarda como `null` (analyze I6).
      properties:
        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        kind:
          type: string
          enum: [direct, group]
        destination:
          type: string
          minLength: 1
          maxLength: 320
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    SocialNetwork:
      type: string
      enum: [facebook, instagram, youtube, tiktok, spotify]
      description: |
        Catálogo fijo de redes (FR-006/Q5). Añadir una red equivalente (p. ej. X)
        es un ajuste menor acordado con el humano: migración que extiende el
        `CHECK` + dominio permitido en el service.

    SocialLinkAdmin:
      type: object
      required: [id, network, url, publicationState, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    SocialLinkInput:
      type: object
      required: [network, url]
      description: |
        Alta del enlace de una red (FR-006/FR-015): red del catálogo y URL `https`
        del dominio oficial de esa red. Un segundo enlace para la misma red → 409.
      properties:
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    SocialLinkPatch:
      type: object
      minProperties: 1
      description: Edición parcial del enlace de una red (al menos un campo presente).
      properties:
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    ImageUploadResult:
      type: object
      required: [fileName, url, mimeType, sizeBytes]
      description: Resultado de una subida (research R3-8). `url` es relativa al origen de la API.
      properties:
        fileName:
          type: string
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
        url:
          type: string
          description: "`/api/v1/media/<fileName>`"
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 8388608
      additionalProperties: false

  responses:
    NotFound:
      description: Ruta no documentada. El fallback del router responde este sobre (la stdlib respondería texto).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: not_found
              message: Recurso no encontrado
    MethodNotAllowed:
      description: Método no documentado para la ruta (p. ej. `POST /healthz`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: method_not_allowed
              message: Método no permitido
    Internal:
      description: |
        Error inesperado. El mensaje es genérico a propósito (FR-013): el
        detalle interno queda registrado en el log estructurado con su
        `request_id` para diagnóstico.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: internal
              message: Error interno del servidor
    DatabaseUnavailable:
      description: |
        Servicio vivo, base de datos NO conectada (fallo previsible de
        `/healthz`; FR-004). La respuesta llega en ≤2 s por el timeout del ping.
      headers:
        Cache-Control:
          description: El estado nunca debe ser cacheado por intermediarios.
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: database_unavailable
              message: La base de datos no está conectada
              details:
                database: disconnected

    Invalid:
      description: |
        Datos inválidos o incompletos, o contraseña que no cumple la política
        (FR-010). `details` indica qué campo corregir; nunca expone información
        interna.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: invalid
              message: Revisa los datos del formulario
              details:
                email: no tiene un formato de correo válido
    Unauthenticated:
      description: |
        Sin sesión válida (expirada por inactividad, cerrada o inexistente) o
        credenciales de inicio de sesión incorrectas. El mensaje de login es
        genérico y **no** revela si la cuenta existe (FR-003).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unauthenticated
              message: Correo o contraseña incorrectos
    Forbidden:
      description: |
        Autenticado pero sin permiso para la operación (FR-016), o cuenta
        desactivada al iniciar sesión (US1 esc. 3), o con la obligación de
        cambiar la contraseña antes de usar el panel (en cuyo caso
        `details.reason = "password_change_required"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: forbidden
              message: No tienes permiso para realizar esta operación
    Conflict:
      description: |
        Conflicto con el estado actual: correo o nombre de rol duplicado (Q5),
        rol con cuentas asignadas al intentar eliminarlo (FR-017), inicialización
        ya ejecutada (FR-007) u operación que dejaría el panel sin administración
        (FR-008, en cuyo caso `details.reason = "admin_required"`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: conflict
              message: Ese correo ya está en uso
    TooManyRequests:
      description: |
        Demasiadas peticiones: bloqueo temporal por intentos fallidos de inicio
        de sesión (creado por el **5.º fallo**; cada intento desde el **6.º** y
        durante 15 minutos recibe esta respuesta, FR-006) o `rate-limit` por IP.
        El mensaje de bloqueo es idéntico exista o no la cuenta (FR-003).
      headers:
        Retry-After:
          description: Segundos hasta que se pueda volver a intentar.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: rate_limited
              message: Demasiados intentos fallidos. El acceso queda bloqueado temporalmente durante 15 minutos
              details:
                retryAfterSeconds: 900
