      summary: Edita un ministerio (los campos presentes)
      description: |
        Actualización parcial (FR-010): solo se tocan los campos presentes; un
        campo con `null` explícito borra su valor opcional (p. ej. `whatsappUrl`,
        `imageFile`, `leaderPhone`). La transacción del guardado escribe **la
        fila completa ya fusionada** —el `PATCH` **fusiona los campos presentes
        sobre la fila actual** y los campos ausentes no cambian—: última
        escritura completa gana (P6-20/R6-16, A6-3). Si el ministerio ya estaba publicado, los
        cambios guardados son visibles de inmediato (FR-013: se publica al
        guardar); `publicationState` cambia el estado por elemento (FR-012) y
        `leaderVisible` la publicación de la ficha del encargado (FR-025/FR-026:
        apagarlo y guardar **conserva** nombre y contacto; activarlo de nuevo los
        publica sin reescribirlos).

        `sortOrder` reordena el módulo (FR-016): el visitante ve exactamente ese
        orden (sección y bloque de la portada). Validaciones del alta, iguales.
        Auditoría: un cambio de datos registra `ministry.update`; solo de estado,
        `ministry.publish`/`ministry.unpublish`; solo de visibilidad de la ficha
        del encargado, `ministry.leader.show`/`ministry.leader.hide`; varios a la
        vez, **una fila por operación** (R6-12).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/MinisterioItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinisterioPatch"
      responses:
        "200":
          description: Ministerio actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinisterioAdmin"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [ministerios-admin]
      operationId: deleteMinisterio
      summary: Elimina un ministerio (definitivo, con confirmación en la interfaz)
      description: |
        Borrado definitivo (default revisable: sin papelera ni recuperación, como
        F3/F4). Desaparece de lo público de inmediato (sección, bloque de la
        portada e imágenes). La interfaz pide confirmación explícita antes de
        llamar (US2 esc. 5). Auditoría: `ministry.delete`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/MinisterioItemId"
      responses:
        "204":
          description: Ministerio eliminado.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/v1/admin/ministerios/imagenes:
    post:
      tags: [ministerios-admin]
      operationId: uploadMinisterioImage
      summary: Sube una imagen para un ministerio (JPEG/PNG/WebP, ≤8 MB)
      description: |
        Multipart (`file`), mismas reglas que la subida de F3/F4 (R3-8): tipo
        detectado por **firma binaria** (sin SVG ni GIF), tope 8 MB
        (`UPLOAD_MAX_BYTES`), nombre generado por el servidor
        (`img_<uuid>.<ext>`) y respuesta con la referencia a incluir en
        `imageFile` (con `imageAltEs` obligatorio, FR-020). La imagen se sirve
        con `GET /api/v1/media/{fileName}` solo mientras esté referenciada por
        un ministerio **publicado** (R6-7). Auditoría: `ministry.image.upload`
        (fail-closed: si el registro falla, la subida se aborta y el archivo se
        elimina).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo de imagen (JPEG, PNG o WebP por firma; máx. 8 MB).
              additionalProperties: false
      responses:
        "201":
          description: Imagen subida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ss_session
      description: |
        Sesión en servidor **en Redis** (D-A7 confirmada el 2026-10-04): cookie
        `ss_session` `HttpOnly` con un token opaco cuyo **SHA-256** es la clave
        en Redis (el token en claro nunca se guarda). Caduca por inactividad
        (30 min) o por vida absoluta (1 h desde el inicio de sesión); su
        `Max-Age` es la vida absoluta. Se emite en `POST /api/v1/auth/login` y se
        borra en logout y en toda revocación. Las peticiones no seguras con
        sesión exigen además la cabecera `X-CSRF-Token` con el valor de la
        cookie `csrf_token`.

  parameters:
    Limit:
      name: limit
      in: query
      description: Tamaño de página (por defecto 20, tope 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Filas a saltar (por defecto 0).
      schema:
        type: integer
        minimum: 0
        default: 0
    UserID:
      name: id
      in: path
      required: true
      description: Identificador (UUID) de la cuenta.
      schema:
        type: string
        format: uuid
    RoleID:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del rol.
      schema:
        type: string
        format: uuid
    AuditUserFilter:
      name: userId
      in: query
      description: |
        Filtra por cuenta (FR-024). En `/admin/auditoria/accesos`, la cuenta que
        intentó el acceso; en `/admin/auditoria/acciones`, la cuenta involucrada
        (la que hizo la acción **o** la cuenta sobre la que se hizo). Los
        registros que **no** tienen ninguna cuenta asociada (hoy: los intentos de
        acceso contra un correo inexistente) solo aparecen cuando **no** se envía
        este filtro. La **inicialización del sistema sí tiene cuenta asociada**
        —su cuenta objetivo (`target_user_id`)—, de modo que aparece al filtrar
        por esa cuenta.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      description: |
        Inicio del rango de fechas (**incluido**), ISO-8601 en UTC (FR-024). Si se
        envía `to` y `from` es posterior → `400 invalid`.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: |
        Fin del rango de fechas (**excluido**), ISO-8601 en UTC: el semirango es
        `[from, to)` (FR-024). Para incluir un día entero, `to` es el inicio del
        día siguiente.
      schema:
        type: string
        format: date-time
    PortadaItemId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del elemento de la portada.
      schema:
        type: string
        format: uuid
    AgendaItemId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del elemento de agenda (evento, actividad o categoría).
      schema:
        type: string
        format: uuid
    MinisterioItemId:
      name: id
      in: path
      required: true
      description: Identificador (UUID) del ministerio.
      schema:
        type: string
        format: uuid

  schemas:
    SystemStatus:
      type: object
      description: |
        Sobre de éxito del endpoint de estado: informe del sistema en el
        momento de la consulta. F1 lo emite únicamente como `200`; si algo
        está degradado, la respuesta es un error con su sobre (p. ej. `503`
        `database_unavailable`), de modo que todo cliente maneja un solo
        formato de error (FR-012).
      required: [status, database]
      properties:
        status:
          type: string
          const: ok
          description: |
            Estado del proceso backend. En F1 el único valor posible es `ok`
            (un `200` siempre significa "servicio sano"). El campo se mantiene
            por FR-002 (la respuesta indica el estado del servicio) y admite
            valores futuros si se agregan más chequeos.
        database:
          type: string
          const: connected
          description: |
            Conexión con PostgreSQL establecida en el momento de la consulta
            (FR-003). El caso "no conectada" se comunica como `503` con
            `error.code = database_unavailable` y
            `error.details.database = "disconnected"`.
      additionalProperties: false
    ErrorEnvelope:
      type: object
      description: |
        Sobre de error estándar de la API (FR-012/FR-013). Todo 4xx/5xx lo
        usa; es el único formato de error que quien consume debe implementar.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      additionalProperties: false
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estable y accionable de la API (snake_case). Registro cerrado;
            F1 puede emitir: `not_found`, `method_not_allowed`,
            `database_unavailable`, `internal`.
          enum:
            - invalid
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - rate_limited
            - database_unavailable
            - internal
        message:
          type: string
          description: |
            Mensaje seguro y comprensible (español). Nunca contiene nombres
            internos, trazas de error, SQL ni datos de infraestructura (FR-013).
            Para `internal` es siempre el genérico "Error interno del servidor".
          example: La base de datos no está conectada
        details:
          type: object
          description: |
            Detalle opcional y seguro: por campo en validaciones (F2+) o datos
            de diagnóstico del caso (p. ej. `{"database":"disconnected"}`).
            Nunca información interna del sistema.
          additionalProperties: true
      additionalProperties: false

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Correo de la cuenta (se normaliza con trim + minúsculas).
        password:
          type: string
          format: password
          maxLength: 64
          description: Contraseña en texto plano (solo viaja aquí; nunca se devuelve ni se guarda).
      additionalProperties: false
    SessionUser:
      type: object
      description: |
        Identidad de la sesión iniciada con sus permisos efectivos (los del rol
        asignado; nunca la suma de varios roles, Q4). No contiene ningún dato
        sensible de credenciales (FR-003).
      required: [id, email, firstName, lastName, phone, roleId, roleName, permissions, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          description: Nombre de la persona (datos de la cuenta confirmados el 2026-10-04).
        lastName:
          type: string
          description: Apellidos de la persona.
        phone:
          type: string
          description: Número de teléfono (formato telefónico razonable, FR-009).
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        permissions:
          type: array
          description: Códigos de permiso del catálogo (p. ej. `eventos`, `admin_usuarios_roles`).
          items:
            type: string
        mustChangePassword:
          type: boolean
          description: Si es `true`, la cuenta debe cambiar su contraseña antes de usar el panel (US7 esc. 4).
      additionalProperties: false
    LogoutResponse:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          const: true
      additionalProperties: false
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 64
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: |
            Política FR-010: entre 8 y 64 caracteres, con mayúsculas,
            minúsculas, números y caracteres especiales, y **distinta de** (no
            de contenido: se rechaza que sea **igual**, con comparación
            normalizada) el nombre, los apellidos y el correo.
      additionalProperties: false
    PasswordChangedResponse:
      type: object
      required: [passwordChanged]
      properties:
        passwordChanged:
          type: boolean
          const: true
      additionalProperties: false
    InitializeInput:
      type: object
      description: |
        Datos de la cuenta del primer administrador: los mismos campos
        obligatorios de toda cuenta (nombre, apellidos, correo y teléfono;
        confirmados el 2026-10-04) y su contraseña.
      required: [firstName, lastName, email, phone, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
          description: Formato telefónico razonable (FR-009), con dígitos, separadores habituales, prefijo internacional opcional y al menos 7 dígitos.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Contraseña del administrador inicial (misma política FR-010; no exige cambio al entrar).
      additionalProperties: false
    CreateUserInput:
      type: object
      required: [firstName, lastName, email, phone, roleId, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre de la persona (campo obligatorio y separado de los apellidos; FR-009).
        lastName:
          type: string
          minLength: 1
          maxLength: 120
          description: Apellidos de la persona (campo obligatorio; FR-009).
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
          description: |
            Número de teléfono obligatorio (FR-009): dígitos con espacios,
            guiones o paréntesis como separadores habituales, un prefijo
            internacional opcional y al menos 7 dígitos. Un formato que no es
            telefónico → `400` con `details.phone`.
        roleId:
          type: string
          format: uuid
          description: Rol existente (uno solo por cuenta, Q4). Un rol inexistente → `400` con `details.roleId`.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Contraseña inicial definida por el administrador (FR-010); su titular debe cambiarla al entrar.
      additionalProperties: false
    UpdateUserInput:
      type: object
      description: |
        Al menos un campo (nombre, apellidos, correo, teléfono, rol o estado;
        mismas validaciones que al crear, FR-011). El nuevo rol reemplaza al
        anterior (Q4). `isActive: false` bloquea el acceso de inmediato y
        revoca las sesiones abiertas (FR-012); nunca se eliminan cuentas
        (FR-013).
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        roleId:
          type: string
          format: uuid
        isActive:
          type: boolean
      minProperties: 1
      additionalProperties: false
    ResetPasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Contraseña nueva definida por el administrador (FR-010).
      additionalProperties: false
    PasswordResetResponse:
      type: object
      required: [passwordReset]
      properties:
        passwordReset:
          type: boolean
          const: true
      additionalProperties: false
    UserItem:
      type: object
      description: |
        Cuenta del panel en listados y detalle (FR-019). Incluye la fecha y el
        origen de su último acceso exitoso (FR-021). Nunca incluye credenciales.
      required: [id, email, firstName, lastName, phone, roleId, roleName, isActive, mustChangePassword, lastLoginAt, lastLoginIp, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          description: Nombre de la persona.
        lastName:
          type: string
          description: Apellidos de la persona.
        phone:
          type: string
          description: Número de teléfono (FR-009).
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        isActive:
          type: boolean
          description: "Cuando es `false`, el acceso queda retirado (desactivada); los datos se conservan siempre (FR-012/FR-013)."
        mustChangePassword:
          type: boolean
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          description: |
            Fecha y hora del último acceso **exitoso** al panel (FR-021). `null`
            si la cuenta aún no ha iniciado sesión: la ficha lo indica sin
            mostrar ningún acceso inventado (US8 esc. 6). Solo lo escribe el
            login exitoso; no es editable.
        lastLoginIp:
          type: [string, "null"]
          description: |
            Origen (IP) del último acceso exitoso (FR-021). `null` si aún no hay
            accesos. Solo lo escribe el login exitoso; no es editable.
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    UserList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserItem"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    RoleCreateInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre único (se normaliza con trim + colapso de espacios; unicidad sin distinguir mayúsculas).
        permissions:
          type: array
          minItems: 1
          description: Al menos un permiso del catálogo (FR-014); códigos repetidos se descartan.
          items:
            type: string
      additionalProperties: false
    RoleUpdateInput:
      type: object
      description: Al menos un campo. Si se envía `permissions`, debe traer al menos un permiso (FR-014).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        permissions:
          type: array
          minItems: 1
          items:
            type: string
      minProperties: 1
      additionalProperties: false
    RoleItem:
      type: object
      required: [id, name, permissions, userCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: array
          description: Códigos de permiso del rol (los efectivos de sus cuentas, Q4).
          items:
            type: string
        userCount:
          type: integer
          description: Cuentas con este rol (0 = se puede eliminar, FR-017).
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    RoleList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleItem"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    RoleDeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          const: true
      additionalProperties: false
    PermissionItem:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          description: Código estable del módulo (p. ej. `eventos`, `admin_usuarios_roles`).
        label:
          type: string
          description: Etiqueta para la interfaz en español.
      additionalProperties: false
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionItem"
      additionalProperties: false
    AccessEventItem:
      type: object
      description: |
        Registro de un intento de inicio de sesión (FR-022). **Solo lectura**
        (FR-025) y sin credenciales (FR-026): de un inicio de sesión solo queda
        su resultado, nunca la contraseña probada.
      required: [id, userId, userEmail, userName, result, ip, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: [string, "null"]
          format: uuid
          description: |
            Cuenta asociada cuando se pudo identificar (FR-022). `null` cuando el
            correo no corresponde a ninguna cuenta: el intento queda registrado
            igual, sin asociación y sin crear nada (FR-003, US8 esc. 7).
        userEmail:
          type: [string, "null"]
          format: email
          description: |
            Correo de la cuenta asociada, **derivado por `JOIN` con `users`**
            (valor actual de `users.email`; no se guarda como dato duplicado en
            el registro). `null` si el intento no se asoció a ninguna cuenta: en
            ese caso **no se guarda ni se muestra ningún correo** (ni siquiera el
            probado) y la interfaz indica "Intento sin cuenta asociada".
        userName:
          type: [string, "null"]
          description: |
            Nombre de la cuenta asociada (`firstName lastName`), **derivado por
            `JOIN` con `users`** cuando el intento se identificó con una cuenta
            (FR-022); no es un dato guardado en el registro. `null` cuando el
            intento quedó sin cuenta asociada: la interfaz muestra entonces
            "Intento sin cuenta asociada", sin mostrar ningún correo.
        result:
          type: string
          enum: [success, failure]
          description: |
            `success` = acceso completado; `failure` = intento fallido (incluye
            los de cuentas inactivas y los que ocurren durante un bloqueo
            temporal de FR-006).
        ip:
          type: string
          minLength: 3
          maxLength: 45
          description: IP de origen del intento (sin puerto).
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora del intento (ISO-8601 en UTC).
      additionalProperties: false
    AccessEventList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: Registros de la página (nunca `null`; vacío es `[]`).
          items:
            $ref: "#/components/schemas/AccessEventItem"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    AdminActionItem:
      type: object
      description: |
        Registro de una acción administrativa sensible (FR-023): quién la hizo,
        qué hizo, sobre qué cuenta o rol, cuándo y con qué resultado —incluidos
        los intentos que no se completan y los denegados por falta de permiso—.
        **Solo lectura** (FR-025) y sin credenciales (FR-026): de un
        restablecimiento de contraseña solo queda quién lo hizo, sobre qué cuenta
        y cuándo.
      required: [id, actorId, actorEmail, actorName, action, targetKind, targetId, targetLabel, result, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: [string, "null"]
          format: uuid
          description: |
            Cuenta que hizo la acción. `null` **solo** en la inicialización del
            sistema (FR-007), cuando todavía no existía ninguna cuenta.
        actorEmail:
          type: [string, "null"]
          format: email
          description: |
            Correo de quien hizo la acción, **derivado por `JOIN` con `users`**
            (valor actual de `users.email`; no se guarda como dato duplicado en
            el registro). `null` en la inicialización del sistema (sin actor).
        actorName:
          type: [string, "null"]
          description: |
            Nombre de quien hizo la acción (`firstName lastName`), **derivado por
            `JOIN` con `users`** cuando hay actor (FR-023); no es un dato
            guardado en el registro. `null` en la inicialización del sistema.
        action:
          type: string
          enum:
            - user.create
            - user.update
            - user.activate
            - user.deactivate
            - user.password_reset
            - role.create
            - role.update
            - role.delete
            - home.identity.update
            - home.about.update
            - home.contact.update
            - home.schedule.create
            - home.schedule.update
            - home.schedule.delete
            - home.whatsapp.create
            - home.whatsapp.update
            - home.whatsapp.delete
            - home.social.create
            - home.social.update
            - home.social.delete
            - home.image.upload
            - home.publish
            - home.unpublish
            - event.create
            - event.update
            - event.delete
            - event.publish
            - event.unpublish
            - event.image.upload
            - activity.create
            - activity.update
            - activity.delete
            - activity.publish
            - activity.unpublish
            - activity.image.upload
            - category.create
            - category.update
            - category.delete
            - ministry.create
            - ministry.update
            - ministry.delete
            - ministry.publish
            - ministry.unpublish
            - ministry.leader.show
            - ministry.leader.hide
            - ministry.image.upload
          description: |
            Qué se hizo (FR-023). La inicialización del administrador inicial
            (FR-007) se registra como `user.create` sin actor: cuenta como
            creación de cuenta. El cambio de la propia contraseña (FR-020) **no**
            aparece aquí.

            F3 (FR-017) añade los 15 códigos `home.*` de la portada, con la regla
            exacta de `analyze` M5: el alta usa `home.*.create` aunque el elemento
            nazca publicado; `home.publish`/`home.unpublish` registran **solo**
            cambios de estado (una edición que cambia datos y estado deja dos
            filas); la subida de una imagen se audita con `home.image.upload`
            (`analyze` I8).

            F4 (FR-017) añade los 15 códigos `event.*`, `activity.*` y
            `category.*` (incluidos los tres del catálogo de categorías), con la
            **misma** regla: el alta usa `*.create` aunque el elemento nazca
            publicado; `*.publish`/`*.unpublish` registran **solo** cambios de
            estado (datos y estado a la vez → dos filas); la subida de una imagen
            se audita con `event.image.upload`/`activity.image.upload`.

            F6 (FR-017) añade los 8 códigos `ministry.*` con la **misma** regla
            (R6-12): el alta registra **solo `ministry.create`** —también con
            `publicationState: published` y `leaderVisible: true`—;
            `ministry.publish`/`ministry.unpublish` registran **solo** cambios de
            estado; `ministry.leader.show`/`ministry.leader.hide` registran
            **solo** el cambio de visibilidad de la ficha del encargado (nombre y
            contacto) sobre un ministerio **existente** —nunca el alta—;
            `ministry.update` cualquier otro cambio de datos (incluido
            `sortOrder`); datos y estado/visibilidad en el mismo guardado → una
            fila por operación; la subida de una imagen se audita con
            `ministry.image.upload`.
        targetKind:
          type: string
          enum: [user, role, content]
          description: |
            Sobre qué se hizo: una cuenta (`user`), un rol (`role`) o un elemento
            de contenido (`content`, F3 para la portada, F4 para eventos,
            actividades y categorías de agenda y F6 para ministerios). Para
            `content`, `targetId` es
            `null` (los elementos de contenido no tienen FK en `admin_actions`) y
            `targetLabel` identifica el elemento
            (`Portada · <Sección> · <nombre>`, `Eventos · <título>`,
            `Actividades · <título>`, `Categorías · <nombre>`,
            `Ministerios · <nombre>`).
        targetId:
          type: [string, "null"]
          format: uuid
          description: |
            Cuenta o rol sobre el que se hizo. `null` cuando no llegó a existir
            (p. ej. una creación rechazada por duplicado) o cuando el rol ya fue
            eliminado (FR-017): el registro se conserva igualmente (FR-025) y su
            `targetLabel` sigue diciendo sobre qué fue. En las acciones con
            `targetKind: content` (F3/F4/F6) es siempre `null`: el elemento de
            contenido se identifica por su `targetLabel`.
        targetLabel:
          type: [string, "null"]
          description: |
            Etiqueta del objetivo en el momento de la acción (correo de la cuenta,
            nombre del rol o, en las acciones de contenido, `Portada · <Sección>
            · <nombre del elemento>` (F3), `Eventos · <título>`,
            `Actividades · <título>` o `Categorías · <nombre>` (F4)) y
            `Ministerios · <nombre>` / `Ministerios · Imagen · <fileName>` (F6).
            Se conserva
            aunque después se edite o elimine.
        result:
          type: string
          enum: [success, failure, denied]
          description: |
            `success` = completada; `failure` = intento que no se completó (datos
            inválidos, duplicado, regla anti-bloqueo…); `denied` = denegada por
            falta de permiso (FR-016).
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de la acción (ISO-8601 en UTC).
      additionalProperties: false
