        nameEs:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: [string, "null"]
          maxLength: 120
        kind:
          type: string
          enum: [direct, group]
        destination:
          type: string
          minLength: 1
          maxLength: 320
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        sortOrder:
          type: integer
      additionalProperties: false

    SocialNetwork:
      type: string
      enum: [facebook, instagram, youtube, tiktok, spotify]
      description: |
        Catálogo fijo de redes (FR-006/Q5). Añadir una red equivalente (p. ej. X)
        es un ajuste menor acordado con el humano: migración que extiende el
        `CHECK` + dominio permitido en el service.

    SocialLinkAdmin:
      type: object
      required: [id, network, url, publicationState, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    SocialLinkInput:
      type: object
      required: [network, url]
      description: |
        Alta del enlace de una red (FR-006/FR-015): red del catálogo y URL `https`
        del dominio oficial de esa red. Un segundo enlace para la misma red → 409.
      properties:
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    SocialLinkPatch:
      type: object
      minProperties: 1
      description: Edición parcial del enlace de una red (al menos un campo presente).
      properties:
        network:
          $ref: "#/components/schemas/SocialNetwork"
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        publicationState:
          $ref: "#/components/schemas/PublicationState"
      additionalProperties: false

    ImageUploadResult:
      type: object
      required: [fileName, url, mimeType, sizeBytes]
      description: Resultado de una subida (research R3-8). `url` es relativa al origen de la API.
      properties:
        fileName:
          type: string
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
        url:
          type: string
          description: "`/api/v1/media/<fileName>`"
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 8388608
      additionalProperties: false

    # ------------------------------------------------------------ comunes
    Date:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: |
        Fecha de calendario del lugar ("YYYY-MM-DD"). No es un timestamp: no se
        convierte de zona horaria (FR-009: el día real del elemento no cambia).
        El formato visible lo localiza el cliente.
    ClockTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: |
        Hora "HH:MM" de 24 h del lugar. El formato a.m./p.m. es presentación del
        cliente (patrón de F3).
    CategoriaPublica:
      type: object
      required: [id, name]
      description: Categoría publicada del elemento, ya localizada a `lang` (Q6).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
      additionalProperties: false
    ImagenPublica:
      type: object
      required: [url, alt]
      description: Imagen opcional del elemento con su texto alternativo accesible (FR-020).
      properties:
        url:
          type: string
          description: URL relativa al origen de la API (`/api/v1/media/<file>`).
        alt:
          type: string
          maxLength: 300
          description: Texto alternativo (FR-020); resuelto a `lang` con fallback.
      additionalProperties: false
    OcurrenciaPublica:
      type: object
      required: [date]
      description: |
        Fecha concreta de un evento con su horario opcional (Q2). Solo fechas
        **próximas** viajan en la respuesta pública (FR-002/FR-006).
      properties:
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de inicio opcional (`null`/ausente = sin hora).
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de fin opcional; **exige `startTime`** (decisión firme de la puerta 2) y siempre es posterior a él.
      additionalProperties: false

    # ------------------------------------------------------------- público
    PortadaProximamente:
      type: object
      required: [lang]
      description: |
        Extracto «Lo que viene» de la portada (US7, enmienda del 2026-10-12,
        **refinada el mismo día**): hasta **5** ítems próximos, eventos y
        actividades juntos y ordenados por cercanía (ventana de 2 meses con
        respaldo; ver la descripción de la operación). `items` está presente
        **solo** si hay ítems; vacío/ausente significa "no hay nada publicado y
        próximo" y la portada muestra el bloque con su mensaje (FR-026). Nunca
        es `null` (§8.1.2) y nunca supera los 5 elementos (FR-025, tope firme
        del servidor: no es configurable desde la API).
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ItemProximoPortada"
      additionalProperties: false
    ItemProximoPortada:
      type: object
      required: [kind, id, title, date, place]
      description: |
        Ítem del bloque de la portada: **solo** lo que la tarjeta compacta de la
        fila horizontal muestra (FR-025) — identificación como evento o
        actividad (Decisión 3), título, **próxima** fecha con su horario
        opcional, lugar e **imagen** con su texto alternativo, todo ya localizado
        a `lang` (FR-008). Sin `detail`, categoría ni lista de fechas: el
        detalle vive en la sección `/eventos` (el botón «Ver más eventos» lleva
        a ella; FR-026). La composición visual de la fila y las tarjetas la fija
        `ux.md`.
      properties:
        kind:
          type: string
          enum: [event, activity]
          description: |
            Concepto del ítem (Decisión 3): `event` (encuentro periódico) o
            `activity` (acción puntual). El cliente lo usa para etiquetar el
            ítem y para enlazar al bloque correspondiente de `/eventos`.
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 160
        date:
          allOf:
            - $ref: "#/components/schemas/Date"
          description: |
            Próxima fecha del ítem (`YYYY-MM-DD`): la primera fecha próxima del
            evento o la fecha única de la actividad. Siempre es una fecha
            **próxima** según la regla del servidor (R4-2).
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de inicio opcional (`null`/ausente = sin hora).
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Hora de fin opcional; **exige `startTime`** y siempre es posterior a él.
        place:
          type: string
          maxLength: 200
        image:
          $ref: "#/components/schemas/ImagenPublica"
          description: |
            Imagen opcional del elemento con su texto alternativo (FR-020) para
            la tarjeta compacta; misma URL relativa `/api/v1/media/<file>` y
            misma regla de publicación que la sección (solo contenido publicado
            y próximo). Ausente si el elemento no tiene imagen.
      additionalProperties: false

    ProximamentePublica:
      type: object
      required: [lang]
      description: |
        "Lo que viene" publicado y con fecha desde hoy en adelante, resuelto a
        `lang` (fallback `en → es` por campo, FR-008). Las claves de bloque están
        presentes **solo** si tienen elementos (SC-012); si están presentes, sus
        arrays nunca son `null` (§8.1.2) y están acotados a **200 elementos**
        cada uno (constante de seguridad del servidor, RG4-8 del plan).
        `events` va ordenado por la primera
        fecha próxima de cada evento; `activities` por su fecha (FR-003).
      properties:
        lang:
          type: string
          enum: [es, en]
          description: Idioma en el que se resolvieron los contenidos.
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventoPublico"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActividadPublica"
      additionalProperties: false
    EventoPublico:
      type: object
      required: [id, title, dates, place, detail]
      description: |
        Evento publicado con **al menos una fecha próxima** (FR-004): `dates[0]`
        es "la próxima fecha" que el visitante identifica; el resto son las
        siguientes cargadas. `frequency` es el texto opcional de frecuencia (p.
        ej. «todos los viernes»); el sistema **no** calcula recurrencias.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 160
        frequency:
          type: string
          maxLength: 160
          description: Texto opcional de frecuencia, ya localizado (puede provenir del español por fallback).
        dates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OcurrenciaPublica"
        place:
          type: string
          maxLength: 200
        mapUrl:
          type: string
          maxLength: 500
          description: Enlace de mapa/ubicación opcional (solo se valida el formato; no se verifica el destino).
        detail:
          type: string
          maxLength: 2000
          description: Detalle/descripción, texto plano (≤2.000 caracteres), ya localizado.
        organizer:
          type: string
          maxLength: 160
          description: Organizador/encargado opcional (texto).
        category:
          $ref: "#/components/schemas/CategoriaPublica"
        image:
          $ref: "#/components/schemas/ImagenPublica"
      additionalProperties: false
    ActividadPublica:
      type: object
      required: [id, title, date, place, detail]
      description: |
        Actividad publicada con **fecha única** (Decisión 3/FR-005): un día
        concreto con hora de inicio y hora de fin opcionales (un solo valor de
        hora o ninguno también es válido).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 160
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        place:
          type: string
          maxLength: 200
        mapUrl:
          type: string
          maxLength: 500
        detail:
          type: string
          maxLength: 2000
        organizer:
          type: string
          maxLength: 160
        category:
          $ref: "#/components/schemas/CategoriaPublica"
        image:
          $ref: "#/components/schemas/ImagenPublica"
      additionalProperties: false

    # ------------------------------------------------------------- panel
    EventoAdminList:
      type: object
      required: [items, total, limit, offset]
      description: Listado paginado de eventos del panel (§8.1.2/§8.1.3).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventoAdmin"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      additionalProperties: false
    ActividadAdminList:
      type: object
      required: [items, total, limit, offset]
      description: Listado paginado de actividades del panel (§8.1.2/§8.1.3).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActividadAdmin"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      additionalProperties: false
    CategoriaAdminList:
      type: object
      required: [items]
      description: Catálogo completo (acotado en el servidor, ≤100; sin paginación).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoriaAdmin"
      additionalProperties: false
    FechaAdmin:
      type: object
      required: [id, date, isPast]
      description: Fecha concreta del evento en el panel, con su horario opcional y su marca de pasado (Q4).
      properties:
        id:
          type: string
          format: uuid
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        isPast:
          type: boolean
          description: |
            `true` cuando la fecha ya no es "próxima" según la regla del servidor
            (R4-2): el panel muestra el elemento como pasado sin tocar su estado.
      additionalProperties: false
    EventoAdmin:
      type: object
      required:
        [id, titleEs, detailEs, placeEs, publicationState, dates, nextDate, isPast, createdAt, updatedAt]
      description: |
        Evento completo del panel: ambos idiomas (es obligatorio, en opcional),
        todas sus fechas (próximas y pasadas) y su estado de publicación (FR-010,
        US4 esc. 7).
      properties:
        id:
          type: string
          format: uuid
        titleEs:
          type: string
          maxLength: 160
        titleEn:
          type: [string, "null"]
          maxLength: 160
        frequencyEs:
          type: [string, "null"]
          maxLength: 160
          description: Texto opcional de frecuencia en español (Q1).
        frequencyEn:
          type: [string, "null"]
          maxLength: 160
        detailEs:
          type: string
          maxLength: 2000
        detailEn:
          type: [string, "null"]
          maxLength: 2000
        placeEs:
          type: string
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        mapUrl:
          type: [string, "null"]
          maxLength: 500
        organizerEs:
          type: [string, "null"]
          maxLength: 160
        organizerEn:
          type: [string, "null"]
          maxLength: 160
        categoryId:
          type: [string, "null"]
          format: uuid
        imageFile:
          type: [string, "null"]
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
        imageAltEs:
          type: [string, "null"]
          maxLength: 300
        imageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        dates:
          type: array
          items:
            $ref: "#/components/schemas/FechaAdmin"
          description: Fechas del evento en orden ascendente (próximas y pasadas).
        nextDate:
          type: [string, "null"]
          description: |
            **Siempre presente en la respuesta** (no es un campo opcional: está
            en `required` y solo su **valor** puede ser nulo). Primera fecha
            próxima (`YYYY-MM-DD`) o `null` cuando el elemento no tiene ninguna:
            el panel señala entonces que falta cargar la próxima fecha (default
            revisable). El cliente distingue así "sin próxima fecha" (`null`) de
            cualquier otra cosa.
        isPast:
          type: boolean
          description: "`true` cuando el evento no tiene ninguna fecha próxima (Q4)."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    FechaInput:
      type: object
      required: [date]
      description: Fecha concreta que se guarda para un evento (con horario opcional).
      properties:
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
        endTime:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
      additionalProperties: false
    EventoInput:
      type: object
      required: [titleEs, detailEs, placeEs, dates]
      description: |
        Alta de evento (FR-015). `dates` lleva entre 1 y 50 fechas sin repetir
        (una por día). `publicationState` opcional (por defecto `draft`).
      properties:
        titleEs:
          type: string
          minLength: 1
          maxLength: 160
        titleEn:
          type: [string, "null"]
          maxLength: 160
        frequencyEs:
          type: [string, "null"]
          maxLength: 160
        frequencyEn:
          type: [string, "null"]
          maxLength: 160
        detailEs:
          type: string
          minLength: 1
          maxLength: 2000
        detailEn:
          type: [string, "null"]
          maxLength: 2000
        placeEs:
          type: string
          minLength: 1
          maxLength: 200
        placeEn:
          type: [string, "null"]
          maxLength: 200
        mapUrl:
          type: [string, "null"]
          maxLength: 500
          description: URL https válida (tag `url` de `platform/validate`); solo formato.
        organizerEs:
          type: [string, "null"]
          maxLength: 160
        organizerEn:
          type: [string, "null"]
          maxLength: 160
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Categoría del catálogo (Q6); desconocida → `400 invalid`. `null` = sin categoría.
        imageFile:
          type: [string, "null"]
          pattern: "^img_[0-9a-f-]{36}\\.(jpg|png|webp)$"
          description: Nombre devuelto por `POST /api/v1/admin/eventos/imagenes`.
        imageAltEs:
          type: [string, "null"]
          maxLength: 300
          description: Obligatorio si hay `imageFile` (FR-020).
        imageAltEn:
          type: [string, "null"]
          maxLength: 300
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        dates:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/FechaInput"
      additionalProperties: false
    EventoPatch:
