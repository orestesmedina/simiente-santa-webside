# Servidor estático de la SPA (T025).
# El contenedor sirve dist/ en el puerto 80 con fallback de SPA: toda ruta
# desconocida devuelve index.html para que el router de React la resuelva.
# Coloca dist/ en /usr/share/nginx/html y carga la configuración estándar
# (mime.types, logging) de la imagen oficial nginx:alpine.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html (y las rutas de la SPA provida por el fallback) sin caché:
    # cada carga debe traerse la última build (los assets cambian de hash).
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Vite emite los assets a /assets/<nombre>-<hash>.js|css: el hash garantiza
    # que la URL cambia con cada contenido, así que pueden cachearse de forma
    # inmutable durante un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;
}
